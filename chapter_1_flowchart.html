<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국 교육용 순서도 에디터</title>
    <style>
        :root {
            --c-bg-main: #FBF9F4; 
            --c-bg-card: rgba(255, 255, 255, 0.73); 
            --c-text-main: #2C2A29;
            --c-text-muted: #7D7569;
            --c-border: rgba(44, 42, 41, 0.1);
            --c-accent: #2383E2;
            --c-accent-hover: #1A6CB8;
            --c-brand-green: #1B4332;
            --c-tag-bg: #E8F5E9;
            --c-tag-text: #2E7D32;
            --c-removed-bg: #FFEBEE;
            --c-removed-text: #C62828;
            --c-tab-bg: #F4F1EA;
        }

        body {
            font-family: 'Malgun Gothic', -apple-system, sans-serif;
            background-color: var(--c-bg-main);
            color: var(--c-text-main);
            margin: 0;
            padding: 24px;
            padding-top: 85px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            letter-spacing: 0.03em;
            position: relative;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* 배경 신경망 애니메이션 Canvas */
        #neural-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* 상단 네비게이션 바 */
        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(251, 249, 244, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--c-border);
            z-index: 1000;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--c-brand-green);
            font-family: "Consolas", monospace;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.15em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            transition: all 0.2s ease;
        }
        .back-btn:hover {
            transform: translateX(-3px);
            opacity: 0.8;
        }

        .navbar-brand-text {
            font-size: 13px; 
            font-weight: bold; 
            color: var(--c-brand-green); 
            letter-spacing: 0.15em; 
            text-transform: uppercase;
        }

        /* 메인 레이아웃 */
        .main-layout {
            display: flex;
            width: 100%; 
            height: calc(100vh - 110px); 
            gap: 20px;
            position: relative;
            z-index: 10;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--c-bg-card);
            border: 1px solid var(--c-border);
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(6px);
            box-shadow: 0 10px 30px rgba(44, 42, 41, 0.03);
            display: flex;
            flex-direction: column;
        }

        /* 좌측 패널 (도형 기호 및 사용법) */
        .left-panel {
            flex: 1; 
            max-width: 280px;
            height: 100%;
            gap: 20px;
        }

        .section-title {
            font-size: 13px;
            font-weight: bold;
            color: var(--c-brand-green);
            margin-bottom: 12px;
            letter-spacing: 0.05em;
        }

        .symbol-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid rgba(27, 67, 50, 0.2);
            background: var(--c-tag-bg);
            color: var(--c-brand-green);
            font-weight: bold;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
        }
        .symbol-btn:hover {
            background: #d8f3dc;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(27, 67, 50, 0.08);
        }

        .info-box {
            font-size: 12px;
            color: var(--c-text-muted);
            line-height: 1.6;
            background-color: rgba(244, 241, 234, 0.6);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--c-border);
        }

        /* 우측 패널 (캔버스 및 하단 패널) */
        .right-panel {
            flex: 3.5;
            height: 100%;
            overflow: hidden;
            gap: 14px;
            position: relative;
        }

        /* 툴바 */
        #toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--c-border);
        }

        .tool-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            padding: 9px 16px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.03em;
        }
        .btn-primary { background: var(--c-brand-green); color: white; box-shadow: 0 4px 12px rgba(27, 67, 50, 0.15); }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary { background: var(--c-tab-bg); color: var(--c-text-main); border: 1px solid var(--c-border); }
        .btn-secondary:hover { background: #e8e4d9; }
        .btn-danger { background: var(--c-removed-bg); color: var(--c-removed-text); border: 1px solid rgba(198, 40, 40, 0.2); }
        .btn-danger:hover { background: #ffcdd2; }

        /* 캔버스 영역 */
        #canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            border: 1px solid var(--c-border);
            background-size: 20px 20px;
            background-image: radial-gradient(circle, rgba(44, 42, 41, 0.1) 1px, transparent 1px);
        }

        svg#connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* 노드 디지인 */
        .node {
            position: absolute;
            width: 120px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: move;
            user-select: none;
            box-shadow: 0 4px 12px rgba(44, 42, 41, 0.06);
            transition: box-shadow 0.2s, border-color 0.2s, background-color 0.2s;
            background: white;
            border: 2px solid var(--c-brand-green);
            color: var(--c-text-main);
            text-align: center;
            font-size: 13px;
            padding: 4px;
            box-sizing: border-box;
        }
        .node.selected {
            border-color: var(--c-accent);
            box-shadow: 0 0 0 3px rgba(35, 131, 226, 0.25);
        }
        .node.active-exec {
            border-color: #2E7D32;
            background-color: #E8F5E9;
            box-shadow: 0 0 15px rgba(46, 125, 50, 0.4);
        }

        /* 도형 종류별 스타일 */
        .type-start, .type-end { border-radius: 28px; background: #FFF9C4; border-color: #F57F17; color: #F57F17; }
        .type-process { border-radius: 6px; background: #E1F5FE; border-color: #0288D1; color: #0288D1; }
        .type-io { transform: skewX(-15deg); background: #F3E5F5; border-color: #7B1FA2; color: #7B1FA2; }
        .type-io span { transform: skewX(15deg); }
        .type-decision { width: 95px; height: 95px; transform: rotate(45deg); background: #FFEBEE; border-color: #C62828; color: #C62828; margin: 10px; }
        .type-decision span { transform: rotate(-45deg); display: block; }

        /* 하단 모니터링 패널 */
        #bottom-panel {
            height: 150px;
            background: rgba(244, 241, 234, 0.7);
            border: 1px solid var(--c-border);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            gap: 16px;
            box-sizing: border-box;
        }
        .panel-box {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .panel-box h4 {
            margin: 0 0 6px 2px;
            color: var(--c-brand-green);
            font-size: 12px;
            font-weight: bold;
        }
        .panel-content {
            flex: 1;
            background: #FFFFFF;
            border: 1px solid var(--c-border);
            padding: 10px;
            border-radius: 6px;
            overflow-y: auto;
            font-size: 12px;
            white-space: pre-wrap;
            line-height: 1.5;
            color: var(--c-text-main);
            font-family: 'Consolas', monospace;
        }
    </style>
</head>
<body>

<canvas id="neural-canvas"></canvas>

<!-- 상단 네비게이션 바 -->
<nav class="top-navbar">
    <button onclick="if(document.referrer) { history.back(); } else { location.href='./index.html'; }" class="back-btn">
        ← BACK
    </button>
    <div class="navbar-brand-text">
        FLOWCHART
    </div>
</nav>

<div class="main-layout">
    <!-- 좌측 사이드바 -->
    <div class="card left-panel">
        <div>
            <div class="section-title">교육과정 표준 기호</div>
            <button class="symbol-btn" onclick="createNode('start', '시작')">🟡 단말 (시작)</button>
            <button class="symbol-btn" onclick="createNode('io', '입력: X')">▱ 입출력 (입/출력)</button>
            <button class="symbol-btn" onclick="createNode('process', 'X = X + 1')">▭ 처리 (연산/대입)</button>
            <button class="symbol-btn" onclick="createNode('decision', 'X > 5 ?')">◇ 판단 (조건문)</button>
            <button class="symbol-btn" onclick="createNode('end', '끝')">🔴 단말 (끝)</button>
        </div>
        
        <div class="info-box">
            💡 <strong>사용 방법</strong><br>
            • 도형을 클릭한 후 다른 도형을 클릭하면 <strong>화살표 연결</strong>이 됩니다.<br>
            • 도형을 <strong>더블클릭</strong>하면 내용을 수정할 수 있습니다.
        </div>
    </div>

    <!-- 우측 메인 에디터 -->
    <div class="card right-panel">
        <!-- 상단 툴바 -->
        <div id="toolbar">
            <div class="tool-group">
                <button class="btn btn-primary" onclick="runSimulation()">▶ 실행 시뮬레이션</button>
                <button class="btn btn-secondary" onclick="resetCanvas()">🔄 새로고침</button>
            </div>
            <div class="tool-group">
                <button class="btn btn-secondary" onclick="exportImage()">📷 이미지 내보내기</button>
                <button class="btn btn-danger" onclick="deleteSelected()">🗑️ 선택 삭제</button>
            </div>
        </div>

        <!-- 캔버스 영역 -->
        <div id="canvas-container">
            <svg id="connections">
                <defs>
                    <marker id="arrow" viewBox="0 0 10 10" refX="20" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B4332"/>
                    </marker>
                </defs>
            </svg>
        </div>

        <!-- 하단 정보 패널 -->
        <div id="bottom-panel">
            <div class="panel-box">
                <h4>한국어 의조코드(Pseudocode) 자동 변환</h4>
                <div id="pseudocode" class="panel-content">// 순서도를 작성하면 한국어 설명 코드가 실시간 생성됩니다.</div>
            </div>
            <div class="panel-box">
                <h4>실행 콘솔 / 상태 모니터링</h4>
                <div id="console-output" class="panel-content">시뮬레이션을 실행하면 단계별 흐름이 여기에 표시됩니다.</div>
            </div>
        </div>
    </div>
</div>

<script>
    let nodes = [];
    let connections = [];
    let selectedNode = null;
    let connectSourceNode = null;
    let nodeIdCounter = 1;

    const canvas = document.getElementById('canvas-container');
    const svg = document.getElementById('connections');

    // 노드 생성 함수
    function createNode(type, defaultText) {
        const id = 'node_' + nodeIdCounter++;
        const nodeEl = document.createElement('div');
        nodeEl.className = `node type-${type}`;
        nodeEl.id = id;
        
        const textSpan = document.createElement('span');
        textSpan.innerText = defaultText;
        nodeEl.appendChild(textSpan);

        // 기본 위치 배치
        const x = 80 + (nodes.length * 25) % 250;
        const y = 80 + (nodes.length * 25) % 200;
        nodeEl.style.left = x + 'px';
        nodeEl.style.top = y + 'px';

        const nodeData = { id, type, text: defaultText, x, y, el: nodeEl };
        nodes.push(nodeData);
        canvas.appendChild(nodeEl);

        initNodeEvents(nodeData);
        updatePseudocode();
    }

    // 노드 이벤트 핸들러
    function initNodeEvents(node) {
        let isDragging = false;
        let offsetX, offsetY;

        node.el.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            
            if (connectSourceNode && connectSourceNode !== node) {
                addConnection(connectSourceNode, node);
                connectSourceNode = null;
                clearSelection();
                return;
            }

            selectNode(node);
            isDragging = true;
            offsetX = e.clientX - node.x;
            offsetY = e.clientY - node.y;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            node.x = e.clientX - offsetX;
            node.y = e.clientY - offsetY;
            node.el.style.left = node.x + 'px';
            node.el.style.top = node.y + 'px';
            drawConnections();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        node.el.addEventListener('dblclick', () => {
            const newText = prompt('노드 텍스트를 입력하세요:', node.text);
            if (newText !== null) {
                node.text = newText;
                node.el.querySelector('span').innerText = newText;
                updatePseudocode();
            }
        });
    }

    function selectNode(node) {
        clearSelection();
        selectedNode = node;
        connectSourceNode = node;
        node.el.classList.add('selected');
    }

    function clearSelection() {
        nodes.forEach(n => n.el.classList.remove('selected'));
        selectedNode = null;
    }

    canvas.addEventListener('click', () => {
        clearSelection();
        connectSourceNode = null;
    });

    // 노드 연결 함수
    function addConnection(source, target) {
        if (connections.some(c => c.source.id === source.id && c.target.id === target.id)) return;
        
        let label = "";
        if (source.type === 'decision') {
            label = prompt("'참(Yes)' 연결이면 '참', '거짓(No)' 연결이면 '거짓'을 입력하세요:", "참") || "";
        }

        connections.push({ source, target, label });
        drawConnections();
        updatePseudocode();
    }

    // SVG 연결선 그리기
    function drawConnections() {
        const paths = svg.querySelectorAll('g');
        paths.forEach(p => p.remove());

        connections.forEach(conn => {
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            
            const sx = conn.source.x + 60;
            const sy = conn.source.y + 27;
            const tx = conn.target.x + 60;
            const ty = conn.target.y + 27;

            const d = `M ${sx} ${sy} C ${sx} ${(sy + ty) / 2}, ${tx} ${(sy + ty) / 2}, ${tx} ${ty}`;
            path.setAttribute('d', d);
            path.setAttribute('stroke', '#1B4332');
            path.setAttribute('stroke-width', '2');
            path.setAttribute('fill', 'none');
            path.setAttribute('marker-end', 'url(#arrow)');

            g.appendChild(path);

            if (conn.label) {
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', (sx + tx) / 2);
                text.setAttribute('y', (sy + ty) / 2 - 5);
                text.setAttribute('fill', '#C62828');
                text.setAttribute('font-size', '12');
                text.setAttribute('font-weight', 'bold');
                text.textContent = conn.label;
                g.appendChild(text);
            }

            svg.appendChild(g);
        });
    }

    // 실시간 의조코드 생성
    function updatePseudocode() {
        const codeBox = document.getElementById('pseudocode');
        if (nodes.length === 0) {
            codeBox.innerText = "// 순서도를 작성하면 한국어 설명 코드가 실시간 생성됩니다.";
            return;
        }

        let codeStr = "알고리즘 시작:\n";
        nodes.forEach((n) => {
            if (n.type === 'start') codeStr += `1. 시작\n`;
            else if (n.type === 'io') codeStr += `2. [입출력] ${n.text}\n`;
            else if (n.type === 'process') codeStr += `3. [처리] ${n.text} 실행\n`;
            else if (n.type === 'decision') codeStr += `4. [조건] 만약 (${n.text}) 조건 검사\n`;
            else if (n.type === 'end') codeStr += `5. 종료\n`;
        });
        codeBox.innerText = codeStr;
    }

    // 시뮬레이터 실행
    async function runSimulation() {
        const consoleBox = document.getElementById('console-output');
        consoleBox.innerText = "▶ 시뮬레이션 시작...\n";

        const startNode = nodes.find(n => n.type === 'start');
        if (!startNode) {
            alert('시작 노드가 없습니다!');
            return;
        }

        let currentNode = startNode;

        while (currentNode) {
            nodes.forEach(n => n.el.classList.remove('active-exec'));
            currentNode.el.classList.add('active-exec');

            consoleBox.innerText += `[실행 중] -> ${currentNode.text}\n`;
            await new Promise(r => setTimeout(r, 900));

            if (currentNode.type === 'end') {
                consoleBox.innerText += "✅ 성공적으로 종료되었습니다.\n";
                break;
            }

            const nextConns = connections.filter(c => c.source.id === currentNode.id);
            if (nextConns.length === 0) {
                consoleBox.innerText += "⚠️ 연결된 다음 흐름선이 없습니다.\n";
                break;
            }

            if (currentNode.type === 'decision') {
                const yesConn = nextConns.find(c => c.label === '참') || nextConns[0];
                currentNode = yesConn.target;
            } else {
                currentNode = nextConns[0].target;
            }
        }

        setTimeout(() => {
            nodes.forEach(n => n.el.classList.remove('active-exec'));
        }, 1000);
    }

    function deleteSelected() {
        if (!selectedNode) return;
        nodes = nodes.filter(n => n.id !== selectedNode.id);
        connections = connections.filter(c => c.source.id !== selectedNode.id && c.target.id !== selectedNode.id);
        selectedNode.el.remove();
        clearSelection();
        drawConnections();
        updatePseudocode();
    }

    function resetCanvas() {
        nodes.forEach(n => n.el.remove());
        nodes = [];
        connections = [];
        nodeIdCounter = 1;
        drawConnections();
        updatePseudocode();
        document.getElementById('console-output').innerText = "초기화되었습니다.";
    }

    function exportImage() {
        alert("화면 캡처나 브라우저 인쇄(Ctrl+P)를 이용하여 이미지/PDF로 보관할 수 있습니다.");
    }

    /* 신경망 인터랙티브 배경 스크립트 */
    const bgCanvas = document.getElementById('neural-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    let particles = [];
    const mouse = { x: null, y: null, radius: 150 };

    function resizeBgCanvas() {
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
        initParticles();
    }

    class Particle {
        constructor() {
            this.x = Math.random() * bgCanvas.width;
            this.y = Math.random() * bgCanvas.height;
            this.vx = (Math.random() - 0.5) * 0.35;
            this.vy = (Math.random() - 0.5) * 0.35;
            this.radius = Math.random() * 2 + 1.5; 
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            if (this.x < 0 || this.x > bgCanvas.width) this.vx *= -1;
            if (this.y < 0 || this.y > bgCanvas.height) this.vy *= -1;
            let dx = mouse.x - this.x; let dy = mouse.y - this.y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < mouse.radius) {
                const force = (mouse.radius - distance) / mouse.radius;
                this.x -= dx * force * 0.03; this.y -= dy * force * 0.03;
            }
        }
        draw() {
            bgCtx.beginPath(); bgCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            bgCtx.fillStyle = 'rgba(27, 67, 50, 0.15)'; bgCtx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const particleCount = Math.floor((bgCanvas.width * bgCanvas.height) / 9000);
        for (let i = 0; i < particleCount; i++) particles.push(new Particle());
    }

    function animateBg() {
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        for (let i = 0; i < particles.length; i++) {
            particles[i].update(); particles[i].draw();
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x; const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 110) {
                    bgCtx.beginPath(); bgCtx.moveTo(particles[i].x, particles[i].y); bgCtx.lineTo(particles[j].x, particles[j].y);
                    bgCtx.strokeStyle = `rgba(27, 67, 50, ${0.08 * (1 - dist / 110)})`; bgCtx.lineWidth = 1.0; bgCtx.stroke();
                }
            }
        }
        requestAnimationFrame(animateBg);
    }

    window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
    window.addEventListener('resize', resizeBgCanvas);
    window.addEventListener('DOMContentLoaded', () => { resizeBgCanvas(); animateBg(); });
</script>
</body>
</html>
