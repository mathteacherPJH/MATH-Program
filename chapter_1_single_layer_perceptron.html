<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단층 퍼셉트론 계산 시뮬레이터</title>
    <!-- MathJax 수식 렌더링 라이브러리 추가 -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --c-bg-main: #FBF9F4; 
            --c-bg-card: rgba(255, 255, 255, 0.73); 
            --c-text-main: #2C2A29;
            --c-text-muted: #7D7569;
            --c-border: rgba(44, 42, 41, 0.1);
            --c-accent: #2383E2;
            --c-accent-hover: #1A6CB8;
            --c-save-bg: #E28523;
            --c-save-hover: #C9741B;
            --c-reset-bg: #EB5757;
            --c-reset-hover: #D14343;
            --c-neural-green: rgba(27, 67, 50, 0.12); 
            --c-brand-green: #1B4332;
        }

        body {
            font-family: "Malgun Gothic", -apple-system, sans-serif;
            background-color: var(--c-bg-main);
            color: var(--c-text-main);
            margin: 0;
            padding: 15px;
            padding-top: 75px; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
            overflow-x: hidden;
            letter-spacing: 0.03em;
        }

        #neural-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(251, 249, 244, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(44, 42, 41, 0.1);
            z-index: 1000;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--c-brand-green);
            font-family: "Consolas", monospace;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.15em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            transition: all 0.2s ease;
        }
        .back-btn:hover {
            transform: translateX(-3px);
            opacity: 0.8;
        }

        .navbar-brand-text {
            font-size: 12px; 
            font-weight: bold; 
            color: var(--c-brand-green); 
            letter-spacing: 0.15em; 
            text-transform: uppercase; 
        }

        @media (min-width: 768px) {
            .navbar-brand-text {
                font-size: 14px; 
            }
        }

        .main-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
            position: relative;
            z-index: 10;
        }

        @media (min-width: 1024px) {
            .main-container {
                flex-direction: row;
            }
        }

        .card {
            background-color: var(--c-bg-card);
            border: 1px solid var(--c-border);
            border-radius: 12px; 
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 24px;
            box-sizing: border-box;
            min-width: 0;
            position: relative;
            backdrop-filter: blur(6px);
            box-shadow: 0 10px 30px rgba(44, 42, 41, 0.03);
        }

        .card-left {
            flex: 0 0 390px;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            margin: 14px 0 8px 0;
            color: var(--c-brand-green); 
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .section-title:first-child {
            margin-top: 0;
        }

        .nav-group {
            display: flex;
            gap: 4px;
            background: #F4F1EA; 
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid rgba(44, 42, 41, 0.05);
            flex-wrap: wrap;
        }

        .nav-btn {
            flex: 1;
            min-width: 32px;
            border: none;
            background: transparent;
            padding: 8px 10px;
            font-size: 13px;
            font-weight: bold;
            color: var(--c-text-muted);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            text-align: center;
        }
        .nav-btn.active {
            background: #FFFFFF;
            color: var(--c-brand-green); 
            box-shadow: 0 2px 6px rgba(44,42,41,0.08);
        }

        .param-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
        }
        .param-table th, .param-table td {
            padding: 6px 8px;
            text-align: left;
            border-bottom: 1px dashed rgba(44, 42, 41, 0.1);
        }
        .param-table th {
            font-size: 12px;
            color: var(--c-text-muted);
        }

        .input-num {
            width: 75px;
            padding: 6px 8px;
            font-family: "Consolas", monospace;
            font-size: 13px;
            border: 1px solid rgba(44, 42, 41, 0.15);
            border-radius: 6px;
            outline: none;
            transition: all 0.2s;
            background: #fff;
        }
        .input-num:focus {
            border-color: var(--c-brand-green);
            background-color: #E9F5ED;
        }

        .math-box {
            background: #F4F1EA;
            border: 1px solid rgba(44, 42, 41, 0.1);
            border-radius: 8px;
            padding: 12px 16px;
            font-family: "Consolas", monospace;
            font-size: 13px;
            line-height: 1.6;
            margin-top: 10px;
            word-break: break-all;
        }
        .math-highlight {
            color: var(--c-accent);
            font-weight: bold;
        }
        .math-result {
            color: var(--c-brand-green);
            font-size: 16px;
            font-weight: bold;
        }

        .diagram-wrapper {
            flex: 1;
            min-height: 520px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #FFFFFF;
            border: 1px dashed rgba(44, 42, 41, 0.15);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        #perceptronCanvas {
            width: 100%;
            height: 100%;
        }

        .btn-inline {
            padding: 8px 16px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            transition: opacity 0.2s;
            background-color: var(--c-accent);
        }
        .btn-inline:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <canvas id="neural-canvas"></canvas>

    <nav class="top-navbar">
        <button onclick="history.back()" class="back-btn">
            ← BACK
        </button>
        <div class="navbar-brand-text">
            SINGLE LAYER PERCEPTRON
        </div>
    </nav>

    <div class="main-container">
        <!-- 왼쪽 카드 -->
        <div class="card card-left">
            <div class="section-title">🔢 입력값 개수 선택 (2 ~ 10개)</div>
            <div class="nav-group" id="countGroup"></div>

            <div class="section-title">⚖️ 입력값($x_i$) 및 가중치($w_i$) 설정</div>
            <div style="max-height: 200px; overflow-y: auto; padding-right: 5px;">
                <table class="param-table">
                    <thead>
                        <tr>
                            <th>노드</th>
                            <th>입력값 ($x_i$)</th>
                            <th>가중치 ($w_i$)</th>
                        </tr>
                    </thead>
                    <tbody id="paramTbody"></tbody>
                </table>
            </div>

            <div class="section-title">🎯 편향 (Bias, $b$) 설정</div>
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:5px;">
                <span style="font-size:13px; color:var(--c-text-muted);">Bias ($b$):</span>
                <input type="number" id="biasInput" class="input-num" value="0.0" step="0.1" onchange="updatePerceptron()">
            </div>

            <div class="section-title">⚡ 활성화 함수 $f(x)$ 선택</div>
            <div class="nav-group">
                <button id="act_step" class="nav-btn active" onclick="setActivation('step')">계단 (Step)</button>
                <button id="act_relu" class="nav-btn" onclick="setActivation('relu')">ReLU</button>
                <button id="act_sigmoid" class="nav-btn" onclick="setActivation('sigmoid')">시그모이드</button>
            </div>

            <div class="section-title">📐 연산 결과 스냅샷</div>
            <div class="math-box">
                <div>• 가중합 $x = \sum (x_i \cdot w_i) + b$</div>
                <div id="dotProductFormula" class="math-highlight" style="margin: 4px 0;">x = 0.00</div>
                <hr style="border:0; border-top:1px dashed rgba(44,42,41,0.1); margin:8px 0;">
                <div>• 최종 출력 $Y = f(x)$</div>
                <div id="activationResult" class="math-result">Y = 0.00</div>
            </div>
        </div>

        <!-- 오른쪽 마인드맵 카드 -->
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <div class="section-title" style="margin:0;">🧠 단층 퍼셉트론 마인드맵 연산 구조도</div>
                <button class="btn-inline" onclick="randomizeValues()">🎲 무작위 값 생성</button>
            </div>
            <div class="diagram-wrapper">
                <canvas id="perceptronCanvas"></canvas>
            </div>
        </div>
    </div>

<script>
    // --- 신경망 배경 파티클 효과 ---
    const bgCanvas = document.getElementById('neural-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    let particles = [];
    const mouse = { x: null, y: null, radius: 150 };

    function resizeBgCanvas() {
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
        initParticles();
    }

    class Particle {
        constructor() {
            this.x = Math.random() * bgCanvas.width;
            this.y = Math.random() * bgCanvas.height;
            this.vx = (Math.random() - 0.5) * 0.35;
            this.vy = (Math.random() - 0.5) * 0.35;
            this.radius = Math.random() * 2 + 1.5; 
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0 || this.x > bgCanvas.width) this.vx *= -1;
            if (this.y < 0 || this.y > bgCanvas.height) this.vy *= -1;

            let dx = mouse.x - this.x;
            let dy = mouse.y - this.y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < mouse.radius) {
                const force = (mouse.radius - distance) / mouse.radius;
                this.x -= dx * force * 0.03;
                this.y -= dy * force * 0.03;
            }
        }
        draw() {
            bgCtx.beginPath();
            bgCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            bgCtx.fillStyle = 'rgba(27, 67, 50, 0.19)'; 
            bgCtx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const particleCount = Math.floor((bgCanvas.width * bgCanvas.height) / 9000);
        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }
    }

    function animateBg() {
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();

            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 110) {
                    bgCtx.beginPath();
                    bgCtx.moveTo(particles[i].x, particles[i].y);
                    bgCtx.lineTo(particles[j].x, particles[j].y);
                    bgCtx.strokeStyle = `rgba(27, 67, 50, ${0.09 * (1 - dist / 110)})`;
                    bgCtx.lineWidth = 1.0;
                    bgCtx.stroke();
                }
            }
        }
        requestAnimationFrame(animateBg);
    }

    window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
    window.addEventListener('resize', () => {
        resizeBgCanvas();
        updatePerceptron();
    });

    // --- 퍼셉트론 시뮬레이터 로직 ---
    let nodeCount = 3;
    let inputs = [1.0, 0.5, -0.2];
    let weights = [0.8, -0.4, 1.0];
    let bias = 0.0;
    let activationType = 'step'; 

    const canvas = document.getElementById('perceptronCanvas');
    const ctx = canvas.getContext('2d');

    window.addEventListener('DOMContentLoaded', () => {
        resizeBgCanvas();
        animateBg();
        initNodeCountUI();
        renderParamInputs();
        updatePerceptron();
    });

    function initNodeCountUI() {
        const group = document.getElementById('countGroup');
        group.innerHTML = '';
        for (let i = 2; i <= 10; i++) {
            const btn = document.createElement('button');
            btn.className = `nav-btn ${i === nodeCount ? 'active' : ''}`;
            btn.innerText = i;
            btn.onclick = () => changeNodeCount(i);
            group.appendChild(btn);
        }
    }

    function changeNodeCount(count) {
        nodeCount = count;
        initNodeCountUI();

        while (inputs.length < count) {
            inputs.push(parseFloat((Math.random() * 2 - 1).toFixed(1)));
            weights.push(parseFloat((Math.random() * 2 - 1).toFixed(1)));
        }
        inputs = inputs.slice(0, count);
        weights = weights.slice(0, count);

        renderParamInputs();
        updatePerceptron();
    }

    function renderParamInputs() {
        const tbody = document.getElementById('paramTbody');
        tbody.innerHTML = '';
        for (let i = 0; i < nodeCount; i++) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight:bold; color:var(--c-brand-green);">$x_{${i+1}}$</td>
                <td><input type="number" class="input-num" value="${inputs[i]}" step="0.1" onchange="onValueChange(${i}, 'x', this.value)"></td>
                <td><input type="number" class="input-num" value="${weights[i]}" step="0.1" onchange="onValueChange(${i}, 'w', this.value)"></td>
            `;
            tbody.appendChild(tr);
        }
        
        // MathJax 다시 스캔하여 수식 변환
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([tbody]);
        }
    }

    function onValueChange(index, type, val) {
        const num = parseFloat(val) || 0;
        if (type === 'x') inputs[index] = num;
        if (type === 'w') weights[index] = num;
        updatePerceptron();
    }

    function setActivation(type) {
        activationType = type;
        document.getElementById('act_step').classList.toggle('active', type === 'step');
        document.getElementById('act_relu').classList.toggle('active', type === 'relu');
        document.getElementById('act_sigmoid').classList.toggle('active', type === 'sigmoid');
        updatePerceptron();
    }

    function randomizeValues() {
        for (let i = 0; i < nodeCount; i++) {
            inputs[i] = parseFloat((Math.random() * 2 - 1).toFixed(1));
            weights[i] = parseFloat((Math.random() * 2 - 1).toFixed(1));
        }
        bias = parseFloat((Math.random() * 2 - 1).toFixed(1));
        document.getElementById('biasInput').value = bias;
        renderParamInputs();
        updatePerceptron();
    }

    function calculateActivation(x) {
        if (activationType === 'step') {
            return x >= 0 ? 1 : 0;
        } else if (activationType === 'relu') {
            return Math.max(0, x);
        } else if (activationType === 'sigmoid') {
            return 1 / (1 + Math.exp(-x));
        }
        return 0;
    }

    function updatePerceptron() {
        bias = parseFloat(document.getElementById('biasInput').value) || 0;

        let dotProduct = 0;
        let formulaTerms = [];
        for (let i = 0; i < nodeCount; i++) {
            dotProduct += inputs[i] * weights[i];
            formulaTerms.push(`(${inputs[i]} \\cdot ${weights[i]})`);
        }
        const weightedSum = dotProduct + bias;
        const finalOutput = calculateActivation(weightedSum);

        // 수식 텍스트 업데이트
        const formulaContainer = document.getElementById('dotProductFormula');
        const formulaStr = formulaTerms.join(' + ') + (bias >= 0 ? ` + ${bias}` : ` - ${Math.abs(bias)}`);
        formulaContainer.innerHTML = `$x = ${formulaStr} = ${weightedSum.toFixed(2)}$`;
        
        document.getElementById('activationResult').innerHTML = `$Y = f(x) = ${finalOutput.toFixed(3)}$`;

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([formulaContainer, document.getElementById('activationResult')]);
        }

        drawDiagram(weightedSum, finalOutput);
    }

    // --- 마인드맵 도식화 캔버스 랜더링 ---
    function drawDiagram(weightedSum, finalOutput) {
        const wrapper = canvas.parentElement;
        canvas.width = wrapper.clientWidth;
        canvas.height = wrapper.clientHeight;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const w = canvas.width;
        const h = canvas.height;

        const xInput = w * 0.16;
        const xSum = w * 0.52;
        const xAct = w * 0.74;
        const xOutput = w * 0.90;

        // 노드 간 간격 개선: 최소 간격(spacing)을 확보하여 넉넉히 벌어지도록 조정
        const minSpacing = 55; 
        const calculatedSpacing = (h - 100) / (nodeCount + 1);
        const spacing = Math.max(minSpacing, calculatedSpacing);
        
        const totalHeight = spacing * (nodeCount - 1);
        const startY = (h - totalHeight) / 2;

        const inputYList = [];
        for (let i = 0; i < nodeCount; i++) {
            inputYList.push(startY + i * spacing);
        }

        const centerY = h / 2;

        // 1. 가중치 연결선
        for (let i = 0; i < nodeCount; i++) {
            const iy = inputYList[i];
            const weightVal = weights[i];

            ctx.beginPath();
            ctx.moveTo(xInput + 24, iy);
            ctx.lineTo(xSum - 36, centerY);
            
            ctx.strokeStyle = weightVal >= 0 ? 'rgba(35, 131, 226, 0.45)' : 'rgba(235, 87, 87, 0.45)';
            ctx.lineWidth = Math.min(Math.abs(weightVal) * 2 + 1, 5);
            ctx.stroke();

            // 가중치 텍스트 표시
            const midX = (xInput + xSum) / 2 - 5;
            const midY = (iy + centerY) / 2;
            ctx.fillStyle = '#7D7569';
            ctx.font = '11px Consolas';
            ctx.fillText(`w${i+1}=${weightVal}`, midX, midY - 4);
        }

        // 2. Bias 연결선
        ctx.beginPath();
        ctx.moveTo(xSum, centerY - 75);
        ctx.lineTo(xSum, centerY - 36);
        ctx.strokeStyle = 'rgba(226, 133, 35, 0.5)';
        ctx.lineWidth = 2;
        ctx.setLineDash([3, 3]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Bias 노드
        drawNode(xSum, centerY - 80, 18, '#E28523', `${bias}`, `b (Bias)`, '#FFFFFF');

        // 3. 연결선 (Sum -> Activation -> Output)
        ctx.beginPath();
        ctx.moveTo(xSum + 36, centerY);
        ctx.lineTo(xAct - 28, centerY);
        ctx.strokeStyle = '#1B4332';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(xAct + 28, centerY);
        ctx.lineTo(xOutput - 22, centerY);
        ctx.strokeStyle = '#1B4332';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // 4. 입력 노드들 그리기 (원 안에 입력값 x_i 표시)
        for (let i = 0; i < nodeCount; i++) {
            drawNode(
                xInput, 
                inputYList[i], 
                22, 
                '#2383E2', 
                `${inputs[i]}`,       // 원 안에 실제 입력값 x_i 내포
                `x${i+1}`,           // 원 상단에 노드명 표시
                '#FFFFFF',
                true                  // 상단 서브라벨 모드
            );
        }

        // 5. 가중합 노드 (Σ)
        drawNode(xSum, centerY, 36, '#1B4332', 'Σ', `x = ${weightedSum.toFixed(2)}`, '#F4F1EA');

        // 6. 활성화 함수 노드
        let actLabel = 'Step';
        if (activationType === 'relu') actLabel = 'ReLU';
        if (activationType === 'sigmoid') actLabel = 'σ';
        drawNode(xAct, centerY, 28, '#2383E2', actLabel, `f(x)`, '#FFFFFF');

        // 7. 최종 출력 노드 (Y)
        drawNode(xOutput, centerY, 22, '#1B4332', `${finalOutput.toFixed(2)}`, 'Output Y', '#FFFFFF');
    }

    function drawNode(x, y, radius, color, mainText, subText, bgColor = '#FFFFFF', subOnTop = false) {
        // 노드 원형
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fillStyle = bgColor;
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // 원 내부 메인 텍스트 (입력값/결과값)
        ctx.fillStyle = color;
        ctx.font = 'bold 12px Consolas, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(mainText, x, y);

        // 원 외부 서브 텍스트 (노드 명칭 등)
        if (subText) {
            ctx.fillStyle = '#2C2A29';
            ctx.font = 'bold 11px sans-serif';
            
            if (subOnTop) {
                ctx.fillText(subText, x, y - radius - 8);
            } else {
                ctx.fillText(subText, x, y + radius + 14);
            }
        }
    }
</script>

</body>
</html>
