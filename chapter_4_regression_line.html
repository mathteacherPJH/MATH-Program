<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다기능 함수 추세선 분석 도구</title>
    <style>
        :root {
            --c-bg-main: #FBF9F4; 
            --c-bg-card: rgba(255, 255, 255, 0.73); 
            --c-text-main: #2C2A29;
            --c-text-muted: #7D7569;
            --c-border: rgba(44, 42, 41, 0.1);
            --c-accent: #2383E2;
            --c-accent-hover: #1A6CB8;
            --c-brand-green: #1B4332;
            --c-tag-bg: #E8F5E9;
            --c-tag-text: #2E7D32;
            --c-removed-bg: #FFEBEE;
            --c-removed-text: #C62828;
            --c-tab-bg: #F4F1EA;
        }

        body {
            font-family: 'Malgun Gothic', -apple-system, sans-serif;
            background-color: var(--c-bg-main);
            color: var(--c-text-main);
            margin: 0;
            padding: 24px;
            padding-top: 85px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            letter-spacing: 0.03em;
            position: relative;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        #neural-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(251, 249, 244, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--c-border);
            z-index: 1000;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--c-brand-green);
            font-family: "Consolas", monospace;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.15em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            transition: all 0.2s ease;
        }
        .back-btn:hover {
            transform: translateX(-3px);
            opacity: 0.8;
        }

        .navbar-brand-text {
            font-size: 13px; 
            font-weight: bold; 
            color: var(--c-brand-green); 
            letter-spacing: 0.15em; 
            text-transform: uppercase;
        }

        .main-layout {
            display: flex;
            width: 100%; 
            height: calc(100vh - 110px); 
            gap: 20px;
            position: relative;
            z-index: 10;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--c-bg-card);
            border: 1px solid var(--c-border);
            border-radius: 12px;
            padding: 24px;
            box-sizing: border-box;
            backdrop-filter: blur(6px);
            box-shadow: 0 10px 30px rgba(44, 42, 41, 0.03);
            display: flex;
            flex-direction: column;
        }

        .left-panel {
            flex: 1.1; 
            height: 100%;
            min-width: 340px;
            min-height: 0;
        }

        .right-panel {
            flex: 2;
            height: 100%;
            overflow: hidden;
            min-width: 0;
            min-height: 0;
        }

        .model-selector {
            margin-bottom: 14px;
            background-color: rgba(244, 241, 234, 0.6);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--c-border);
        }

        .model-selector label, .variable-names label {
            display: block;
            font-size: 12px;
            color: var(--c-brand-green);
            margin-bottom: 6px;
            font-weight: bold;
        }

        .model-selector select, .variable-names input, .paste-zone input {
            width: 100%;
            padding: 8px 10px;
            box-sizing: border-box;
            border: 1px solid var(--c-border);
            border-radius: 6px;
            font-size: 13px;
            background-color: rgba(255, 255, 255, 0.9);
            color: var(--c-text-main);
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        .model-selector select:focus, .variable-names input:focus, .paste-zone input:focus {
            border-color: var(--c-brand-green);
        }

        .variable-names {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }
        .variable-names div { flex: 1; }

        .paste-zone {
            background-color: var(--c-tag-bg);
            border: 1px dashed var(--c-tag-text);
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 14px;
            font-size: 12px;
            color: var(--c-tag-text);
            font-weight: bold;
        }
        .paste-zone input {
            margin-top: 6px;
            text-align: center;
        }

        .table-wrapper {
            flex: 1;
            overflow-y: auto;
            border: 1px solid var(--c-border);
            border-radius: 8px;
            margin-bottom: 14px;
            min-height: 0; 
            background: rgba(255, 255, 255, 0.6);
        }
        .table-wrapper::-webkit-scrollbar { width: 6px; }
        .table-wrapper::-webkit-scrollbar-track { background: transparent; }
        .table-wrapper::-webkit-scrollbar-thumb { background: rgba(44, 42, 41, 0.15); border-radius: 3px; }

        .spreadsheet { 
            width: 100%; 
            border-collapse: collapse; 
        }
        .spreadsheet th, .spreadsheet td { 
            border-bottom: 1px solid var(--c-border); 
            border-right: 1px solid var(--c-border);
            padding: 6px; 
            text-align: center; 
            font-size: 13px;
        }
        .spreadsheet th:last-child, .spreadsheet td:last-child { border-right: none; }
        .spreadsheet th { 
            background-color: var(--c-tab-bg); 
            color: var(--c-brand-green); 
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .spreadsheet input { 
            width: 100%; 
            border: none; 
            outline: none; 
            background: transparent;
            text-align: center; 
            font-size: 13px; 
            color: var(--c-text-main);
            font-family: inherit;
        }
        .spreadsheet input:focus {
            background-color: #fff;
            border-radius: 3px;
        }
        .spreadsheet tr:hover { background-color: rgba(232, 245, 233, 0.4); }

        .btn-group { display: flex; gap: 8px; margin-top: auto; }
        button { 
            padding: 10px 14px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 13px; 
            transition: opacity 0.2s, transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        .btn-add { background-color: var(--c-tab-bg); color: var(--c-brand-green); border: 1px solid var(--c-border); }
        .btn-add:hover { opacity: 0.85; }
        .btn-clear { background-color: var(--c-removed-bg); color: var(--c-removed-text); }
        .btn-clear:hover { opacity: 0.85; }
        .btn-draw { 
            background-color: var(--c-brand-green); 
            color: white; 
            flex: 1; 
            box-shadow: 0 4px 12px rgba(27, 67, 50, 0.15);
        }
        .btn-draw:hover { opacity: 0.9; }
        
        .delete-btn {
            color: var(--c-removed-text);
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .chart-container { 
            width: 100%; 
            flex: 1;
            min-height: 0; 
            position: relative; 
        }

        .info-panel { 
            margin-top: 14px; 
            padding: 14px; 
            background-color: rgba(244, 241, 234, 0.6); 
            border: 1px solid var(--c-border);
            border-radius: 8px; 
            width: 100%; 
            box-sizing: border-box; 
            font-size: 13px; 
            line-height: 1.6; 
            color: var(--c-text-main);
        }
    </style>
</head>
<body>

<canvas id="neural-canvas"></canvas>

<!-- 상단 네비게이션 바 -->
<nav class="top-navbar">
    <button onclick="if(document.referrer) { history.back(); } else { location.href='./index.html'; }" class="back-btn">
        ← BACK
    </button>
    <div class="navbar-brand-text">
        FUNCTIONAL TRENDLINE ANALYSIS
    </div>
</nav>

<div class="main-layout">
    <!-- 좌측 입력 패널 -->
    <div class="card left-panel">
        <div class="model-selector">
            <label for="trendline-type">📈 추세선 유형 선택</label>
            <select id="trendline-type" onchange="drawChart()">
                <option value="linear">선형 함수 (y = ax + b)</option>
                <option value="quadratic">이차 함수 (y = ax² + bx + c)</option>
                <option value="exponential">지수 함수 (y = a * e^(bx))</option>
                <option value="logarithmic">로그 함수 (y = a * ln(x) + b)</option>
            </select>
        </div>

        <div class="variable-names">
            <div>
                <label for="x-name">X축 변수명</label>
                <input type="text" id="x-name" value="독립변수 X">
            </div>
            <div>
                <label for="y-name">Y축 변수명</label>
                <input type="text" id="y-name" value="종속변수 Y">
            </div>
        </div>

        <div class="paste-zone">
            📋 엑셀 열 복사(Ctrl+C) 후 아래 칸에 붙여넣기(Ctrl+V) 가능
            <input type="text" id="excel-paste-input" placeholder="여기를 클릭하고 Ctrl + V">
        </div>

        <div class="table-wrapper">
            <table class="spreadsheet" id="data-table">
                <thead>
                    <tr>
                        <th style="width: 14%">번호</th>
                        <th style="width: 38%" id="th-x">X 데이터</th>
                        <th style="width: 38%" id="th-y">Y 데이터</th>
                        <th style="width: 10%">삭제</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td>1</td><td><input type="number" class="x-val" value="1"></td><td><input type="number" class="y-val" value="2.1"></td><td class="delete-btn" onclick="deleteRow(this)">×</td></tr>
                    <tr><td>2</td><td><input type="number" class="x-val" value="2"></td><td><input type="number" class="y-val" value="3.9"></td><td class="delete-btn" onclick="deleteRow(this)">×</td></tr>
                    <tr><td>3</td><td><input type="number" class="x-val" value="3"></td><td><input type="number" class="y-val" value="8.2"></td><td class="delete-btn" onclick="deleteRow(this)">×</td></tr>
                    <tr><td>4</td><td><input type="number" class="x-val" value="4"></td><td><input type="number" class="y-val" value="15.8"></td><td class="delete-btn" onclick="deleteRow(this)">×</td></tr>
                    <tr><td>5</td><td><input type="number" class="x-val" value="5"></td><td><input type="number" class="y-val" value="25.2"></td><td class="delete-btn" onclick="deleteRow(this)">×</td></tr>
                </tbody>
            </table>
        </div>

        <div class="btn-group">
            <button class="btn-add" type="button" onclick="addRow()">+ 행 추가</button>
            <button class="btn-clear" type="button" onclick="clearTable()">전체 비우기</button>
            <button class="btn-draw" type="button" onclick="drawChart()">추세선 업데이트 ⚡</button>
        </div>
    </div>

    <!-- 우측 차트 패널 -->
    <div class="card right-panel">
        <div class="chart-container">
            <canvas id="myChart"></canvas>
        </div>
        <div class="info-panel" id="regression-info">
            추세선 버튼을 누르면 통계 분석 결과가 여기에 표시됩니다.
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    let myChart;

    document.getElementById('excel-paste-input').addEventListener('paste', function(e) {
        e.preventDefault();
        const clipboardData = e.clipboardData || window.clipboardData;
        const pastedData = clipboardData.getData('Text');
        if (!pastedData) return;

        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';

        const rows = pastedData.trim().split('\n');
        let validRowCount = 0;

        rows.forEach((row) => {
            const cols = row.split('\t');
            if (cols.length >= 2) {
                const xVal = cols[0].trim();
                const yVal = cols[1].trim();
                if (xVal !== '' && yVal !== '') {
                    validRowCount++;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${validRowCount}</td>
                        <td><input type="number" class="x-val" value="${xVal}"></td>
                        <td><input type="number" class="y-val" value="${yVal}"></td>
                        <td class="delete-btn" onclick="deleteRow(this)">×</td>
                    `;
                    tbody.appendChild(tr);
                }
            }
        });
        this.value = '';
        drawChart();
    });

    function addRow() {
        const tbody = document.getElementById('table-body');
        const rowCount = tbody.rows.length + 1;
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${rowCount}</td>
            <td><input type="number" class="x-val"></td>
            <td><input type="number" class="y-val"></td>
            <td class="delete-btn" onclick="deleteRow(this)">×</td>
        `;
        tbody.appendChild(tr);
        const wrapper = document.querySelector('.table-wrapper');
        wrapper.scrollTop = wrapper.scrollHeight;
    }

    function deleteRow(btn) {
        btn.parentNode.parentNode.removeChild(btn.parentNode);
        reindexRows();
    }

    function clearTable() {
        document.getElementById('table-body').innerHTML = '';
    }

    function reindexRows() {
        document.querySelectorAll('#table-body tr').forEach((row, idx) => {
            row.cells[0].innerText = idx + 1;
        });
    }

    function regLinear(x, y) {
        const n = x.length;
        let sx = 0, sy = 0, sxy = 0, sx2 = 0, sy2 = 0;
        for(let i=0; i<n; i++) {
            sx += x[i]; sy += y[i]; sxy += x[i]*y[i]; sx2 += x[i]*x[i]; sy2 += y[i]*y[i];
        }
        const a = (n*sxy - sx*sy) / (n*sx2 - sx*sx);
        const b = (sy - a*sx) / n;
        
        const meanY = sy / n;
        let ssTot = 0, ssRes = 0;
        for(let i=0; i<n; i++) {
            ssTot += (y[i] - meanY) ** 2;
            ssRes += (y[i] - (a*x[i] + b)) ** 2;
        }
        const r2 = ssTot === 0 ? 0 : 1 - (ssRes / ssTot);
        return { pred: (vx) => a*vx + b, eq: `y = ${a.toFixed(4)}x ${b>=0?'+':'-'} ${Math.abs(b).toFixed(4)}`, r2 };
    }

    function regQuadratic(x, y) {
        const n = x.length;
        let sx=0, sy=0, sx2=0, sx3=0, sx4=0, sxy=0, sx2y=0;
        for(let i=0; i<n; i++) {
            const x1 = x[i], x2 = x1*x1, x3 = x2*x1, x4 = x2*x2, y1 = y[i];
            sx += x1; sy += y1; sx2 += x2; sx3 += x3; sx4 += x4; sxy += x1*y1; sx2y += x2*y1;
        }
        const D = n*(sx2*sx4 - sx3*sx3) - sx*(sx*sx4 - sx2*sx3) + sx2*(sx*sx3 - sx2*sx2);
        if(D === 0) return { pred: () => 0, eq: "계산 불가", r2: 0 };

        const Da = sy*(sx2*sx4 - sx3*sx3) - sx*(sxy*sx4 - sx2y*sx3) + sx2*(sxy*sx3 - sx2y*sx2);
        const Db = n*(sxy*sx4 - sx2y*sx3) - sy*(sx*sx4 - sx2*sx3) + sx2*(sx*sx2y - sxy*sx2);
        const Dc = n*(sx2*sx2y - sx3*sxy) - sx*(sx*sx2y - sx2*sxy) + sy*(sx*sx3 - sx2*sx2);

        const a = Da / D, b = Db / D, c = Dc / D;
        const meanY = sy / n;
        let ssTot = 0, ssRes = 0;
        for(let i=0; i<n; i++) {
            ssTot += (y[i] - meanY) ** 2;
            ssRes += (y[i] - (a*x[i]*x[i] + b*x[i] + c)) ** 2;
        }
        const r2 = ssTot === 0 ? 0 : 1 - (ssRes / ssTot);
        return { 
            pred: (vx) => a*vx*vx + b*vx + c, 
            eq: `y = ${a.toFixed(4)}x² ${b>=0?'+':'-'} ${Math.abs(b).toFixed(4)}x ${c>=0?'+':'-'} ${Math.abs(c).toFixed(4)}`, 
            r2 
        };
    }

    function regExponential(x, y) {
        const validIdx = [];
        for(let i=0; i<y.length; i++) { if(y[i] > 0) validIdx.push(i); }
        if(validIdx.length < 2) return { pred: () => 0, eq: "오류: 모든 Y값이 양수여야 합니다.", r2: 0 };
        
        const n = validIdx.length;
        let sx=0, sLnY=0, sX2=0, sXLnY=0, sy=0;
        validIdx.forEach(i => {
            sx += x[i]; sy += y[i]; sLnY += Math.log(y[i]); sX2 += x[i]*x[i]; sXLnY += x[i]*Math.log(y[i]);
        });

        const b = (n*sXLnY - sx*sLnY) / (n*sX2 - sx*sx);
        const a = Math.exp((sLnY - b*sx) / n);

        const meanY = sy / n;
        let ssTot = 0, ssRes = 0;
        validIdx.forEach(i => {
            ssTot += (y[i] - meanY) ** 2;
            ssRes += (y[i] - (a * Math.exp(b*x[i]))) ** 2;
        });
        const r2 = ssTot === 0 ? 0 : 1 - (ssRes / ssTot);
        return { pred: (vx) => a * Math.exp(b*vx), eq: `y = ${a.toFixed(4)} * e^(${b.toFixed(4)}x)`, r2 };
    }

    function regLogarithmic(x, y) {
        const validIdx = [];
        for(let i=0; i<x.length; i++) { if(x[i] > 0) validIdx.push(i); }
        if(validIdx.length < 2) return { pred: () => 0, eq: "오류: 모든 X값이 양수여야 합니다.", r2: 0 };

        const n = validIdx.length;
        let sLnX=0, sy=0, sLnX_Y=0, sLnX2=0;
        validIdx.forEach(i => {
            const lnx = Math.log(x[i]);
            sLnX += lnx; sy += y[i]; sLnX_Y += lnx*y[i]; sLnX2 += lnx*lnx;
        });

        const a = (n*sLnX_Y - sLnX*sy) / (n*sLnX2 - sLnX*sLnX);
        const b = (sy - a*sLnX) / n;

        const meanY = sy / n;
        let ssTot = 0, ssRes = 0;
        validIdx.forEach(i => {
            ssTot += (y[i] - meanY) ** 2;
            ssRes += (y[i] - (a * Math.log(x[i]) + b)) ** 2;
        });
        const r2 = ssTot === 0 ? 0 : 1 - (ssRes / ssTot);
        return { pred: (vx) => vx > 0 ? a * Math.log(vx) + b : null, eq: `y = ${a.toFixed(4)} * ln(x) ${b>=0?'+':'-'} ${Math.abs(b).toFixed(4)}`, r2 };
    }

    function drawChart() {
        const type = document.getElementById('trendline-type').value;
        const xName = document.getElementById('x-name').value || 'X축';
        const yName = document.getElementById('y-name').value || 'Y축';
        
        document.getElementById('th-x').innerText = xName;
        document.getElementById('th-y').innerText = yName;

        const xInputs = document.querySelectorAll('.x-val');
        const yInputs = document.querySelectorAll('.y-val');
        const xData = [], yData = [];

        for (let i = 0; i < xInputs.length; i++) {
            const xVal = parseFloat(xInputs[i].value);
            const yVal = parseFloat(yInputs[i].value);
            if (!isNaN(xVal) && !isNaN(yVal)) { xData.push(xVal); yData.push(yVal); }
        }

        if (xData.length < 2) {
            alert("데이터가 최소 2개 이상 필요합니다."); return;
        }

        let result;
        if (type === 'linear') result = regLinear(xData, yData);
        else if (type === 'quadratic') result = regQuadratic(xData, yData);
        else if (type === 'exponential') result = regExponential(xData, yData);
        else if (type === 'logarithmic') result = regLogarithmic(xData, yData);

        const minX = Math.min(...xData), maxX = Math.max(...xData);
        const xRange = maxX - minX || 1;
        const xStart = minX - xRange * 0.1;
        const xEnd = maxX + xRange * 0.1;

        const trendlinePoints = [];
        const step = (xEnd - xStart) / 100;
        for(let i=0; i<=100; i++) {
            const curX = xStart + step * i;
            const curY = result.pred(curX);
            if (curY !== null && !isNaN(curY) && isFinite(curY)) {
                trendlinePoints.push({ x: curX, y: curY });
            }
        }

        if (myChart) myChart.destroy();

        const ctx = document.getElementById('myChart').getContext('2d');
        myChart = new Chart(ctx, {
            type: 'scatter',
            data: {
                datasets: [{
                    label: '입력 데이터',
                    data: xData.map((x, i) => ({ x: x, y: yData[i] })),
                    backgroundColor: '#1B4332',
                    pointRadius: 6,
                    hoverRadius: 8
                }, {
                    label: `${document.getElementById('trendline-type').options[document.getElementById('trendline-type').selectedIndex].text.split(' ')[0]} 추세선`,
                    data: trendlinePoints,
                    type: 'line',
                    borderColor: '#2383E2', 
                    borderWidth: 3,
                    fill: false,
                    pointRadius: 0,
                    showLine: true,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { 
                        type: 'linear', 
                        position: 'bottom',
                        grace: '8%', 
                        title: { display: true, text: xName, font: { weight: 'bold', size: 13 }, color: '#1B4332' },
                        ticks: { maxTicksLimit: 10, color: '#2C2A29' },
                        grid: { color: 'rgba(44, 42, 41, 0.05)' }
                    },
                    y: { 
                        type: 'linear', 
                        grace: '8%', 
                        title: { display: true, text: yName, font: { weight: 'bold', size: 13 }, color: '#1B4332' },
                        ticks: { maxTicksLimit: 10, color: '#2C2A29' },
                        grid: { color: 'rgba(44, 42, 41, 0.05)' }
                    }
                }
            }
        });

        const typeNames = { linear: "선형 회귀", quadratic: "이차 다항 회귀", exponential: "지수 회귀", logarithmic: "로그 회귀" };
        
        document.getElementById('regression-info').innerHTML = `
            <strong style="color: var(--c-brand-green); font-size: 14px;">📊 모델 분석 결과 (${typeNames[type]})</strong><br>
            • <strong>추세선 공식:</strong> <span style="color:#2383E2; font-weight:bold; font-size:15px;">${result.eq}</span><br>
            • <strong>결정계수 (R²):</strong> <span style="color:#1B4332; font-weight:bold; font-size:15px;">${result.r2.toFixed(4)}</span> (${(result.r2 * 100).toFixed(1)}%의 설명력)
            ${(type==='exponential'||type==='logarithmic') ? '<br><small style="color:var(--c-text-muted);">* 주의: 지수/로그 모델은 수학적 정의에 따라 데이터 조건(양수)을 만족하는 데이터만 계산에 반영됩니다.</small>':''}
        `;
    }

    // 신경망 백그라운드 캔버스 애니메이션
    const bgCanvas = document.getElementById('neural-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    let particles = [];
    const mouse = { x: null, y: null, radius: 150 };

    function resizeBgCanvas() {
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
        initParticles();
    }

    class Particle {
        constructor() {
            this.x = Math.random() * bgCanvas.width;
            this.y = Math.random() * bgCanvas.height;
            this.vx = (Math.random() - 0.5) * 0.35;
            this.vy = (Math.random() - 0.5) * 0.35;
            this.radius = Math.random() * 2 + 1.5; 
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            if (this.x < 0 || this.x > bgCanvas.width) this.vx *= -1;
            if (this.y < 0 || this.y > bgCanvas.height) this.vy *= -1;
            let dx = mouse.x - this.x; let dy = mouse.y - this.y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < mouse.radius) {
                const force = (mouse.radius - distance) / mouse.radius;
                this.x -= dx * force * 0.03; this.y -= dy * force * 0.03;
            }
        }
        draw() {
            bgCtx.beginPath(); bgCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            bgCtx.fillStyle = 'rgba(27, 67, 50, 0.15)'; bgCtx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const particleCount = Math.floor((bgCanvas.width * bgCanvas.height) / 9000);
        for (let i = 0; i < particleCount; i++) particles.push(new Particle());
    }

    function animateBg() {
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        for (let i = 0; i < particles.length; i++) {
            particles[i].update(); particles[i].draw();
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x; const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 110) {
                    bgCtx.beginPath(); bgCtx.moveTo(particles[i].x, particles[i].y); bgCtx.lineTo(particles[j].x, particles[j].y);
                    bgCtx.strokeStyle = `rgba(27, 67, 50, ${0.08 * (1 - dist / 110)})`; bgCtx.lineWidth = 1.0; bgCtx.stroke();
                }
            }
        }
        requestAnimationFrame(animateBg);
    }

    window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
    window.addEventListener('resize', resizeBgCanvas);
    window.addEventListener('DOMContentLoaded', () => { 
        resizeBgCanvas(); 
        animateBg(); 
        drawChart();
    });
</script>
</body>
</html>
