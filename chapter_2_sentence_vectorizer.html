<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문장 벡터화 프로그램</title>
    <style>
        :root {
            --c-bg-main: #FBF9F4; 
            --c-bg-card: rgba(255, 255, 255, 0.73); 
            --c-text-main: #2C2A29;
            --c-text-muted: #7D7569;
            --c-border: rgba(44, 42, 41, 0.1);
            --c-accent: #2383E2;
            --c-accent-hover: #1A6CB8;
            --c-brand-green: #1B4332;
            --c-brand-green-hover: #123024;
            --c-tag-bg: #E8F5E9;
            --c-tag-text: #2E7D32;
            --c-removed-bg: #FFEBEE;
            --c-removed-text: #C62828;
            --c-vector-text: #0D47A1;
            --c-tab-bg: #F4F1EA;
        }

        body {
            font-family: 'Malgun Gothic', -apple-system, sans-serif;
            background-color: var(--c-bg-main);
            color: var(--c-text-main);
            margin: 0;
            padding: 24px;
            padding-top: 85px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            letter-spacing: 0.03em;
            position: relative;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        #neural-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .top-navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(251, 249, 244, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--c-border);
            z-index: 1000;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--c-brand-green);
            font-family: "Consolas", monospace;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.15em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            transition: all 0.2s ease;
        }
        .back-btn:hover { transform: translateX(-3px); opacity: 0.8; }
        .navbar-brand-text { font-size: 13px; font-weight: bold; color: var(--c-brand-green); letter-spacing: 0.15em; text-transform: uppercase; }

        .main-layout {
            display: flex;
            width: 100%; 
            height: calc(100vh - 110px); 
            gap: 20px;
            position: relative;
            z-index: 10;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--c-bg-card);
            border: 1px solid var(--c-border);
            border-radius: 12px;
            padding: 24px;
            box-sizing: border-box;
            backdrop-filter: blur(6px);
            box-shadow: 0 10px 30px rgba(44, 42, 41, 0.03);
            display: flex;
            flex-direction: column;
        }

        .left-panel { flex: 1.2; height: 100%; }
        .panel-title { margin: 0 0 12px 0; font-size: 16px; color: var(--c-brand-green); font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .input-controls { display: flex; gap: 6px; }

        .control-btn {
            padding: 4px 10px; font-size: 12px; font-weight: bold; border: 1px solid var(--c-border);
            background: white; border-radius: 4px; cursor: pointer; color: var(--c-text-main); transition: all 0.2s;
        }
        .control-btn:hover:not(:disabled) { background: #eee; }
        .control-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .textarea-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px; padding-right: 4px; }
        
        .textarea-wrapper { 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            gap: 8px;
            background: rgba(255, 255, 255, 0.5);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--c-border);
        }
        .textarea-wrapper span.label { font-size: 11px; color: var(--c-text-muted); font-weight: bold; }
        .textarea-inner { position: relative; width: 100%; }
        .textarea-wrapper .char-counter { position: absolute; bottom: 8px; right: 12px; font-size: 11px; color: var(--c-text-muted); pointer-events: none; }

        textarea {
            width: 100%; height: 55px; padding: 10px 12px; padding-bottom: 22px; box-sizing: border-box;
            border: 1px solid var(--c-border); border-radius: 6px; resize: none; font-family: inherit; font-size: 13px;
            line-height: 1.4; background-color: rgba(255, 255, 255, 0.9); color: var(--c-text-main); outline: none; transition: border-color 0.2s;
        }
        textarea:focus { border-color: var(--c-brand-green); }

        /* 문장별 개별 단어집합 편집 영역 */
        .sentence-vocab-box {
            background-color: var(--c-tab-bg);
            border: 1px dashed rgba(27, 67, 50, 0.2);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .sentence-vocab-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .vocab-title {
            font-weight: bold;
            font-size: 11px;
            color: var(--c-brand-green);
        }
        .add-mini-section {
            display: flex;
            gap: 4px;
        }
        .add-mini-input {
            padding: 2px 6px;
            border: 1px solid var(--c-border);
            border-radius: 3px;
            font-size: 11px;
            width: 90px;
            outline: none;
            background: white;
        }
        .add-mini-btn {
            padding: 2px 6px;
            background-color: var(--c-accent);
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }
        .vocab-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        /* ✏️ 편집 가능한 단어 태그 스타일 */
        .mini-tag {
            background: #FFFFFF;
            border: 1px solid rgba(44, 42, 41, 0.15);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            color: var(--c-brand-green);
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .mini-tag-input {
            border: none;
            background: transparent;
            color: var(--c-brand-green);
            font-size: 11px;
            font-family: inherit;
            font-weight: bold;
            outline: none;
            width: 50px;
        }
        .mini-tag-input:focus {
            background-color: var(--c-tag-bg);
            border-radius: 2px;
        }
        .mini-tag-delete {
            cursor: pointer;
            color: var(--c-removed-text);
            font-size: 12px;
            font-weight: bold;
            line-height: 1;
        }

        .run-btn {
            width: 100%; padding: 14px 20px; background-color: var(--c-brand-green); color: white; border: none; border-radius: 8px;
            cursor: pointer; font-size: 16px; font-weight: bold; transition: background-color 0.2s; letter-spacing: 0.05em;
            box-shadow: 0 4px 12px rgba(27, 67, 50, 0.15); flex-shrink: 0;
        }
        .run-btn:hover { background-color: var(--c-brand-green-hover); }

        .right-panel { flex: 2; height: 100%; overflow: hidden; gap: 14px; }
        .nav-group { display: flex; gap: 4px; background: var(--c-tab-bg); padding: 4px; border-radius: 8px; border: 1px solid rgba(44, 42, 41, 0.05); flex-shrink: 0; }
        
        .nav-btn {
            flex: 1; border: none; background: transparent; padding: 8px 4px; font-size: 12px; font-weight: bold;
            color: var(--c-text-muted); cursor: pointer; border-radius: 6px; transition: all 0.2s; white-space: nowrap; text-align: center;
        }
        .nav-btn.active { background: #FFFFFF; color: var(--c-brand-green); box-shadow: 0 2px 6px rgba(44,42,41,0.08); }

        .right-panel-content { width: 100%; height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding-right: 6px; box-sizing: border-box; }
        .result-section { display: flex; flex-direction: column; width: 100%; box-sizing: border-box; }
        .result-section.hidden { display: none !important; }
        
        .result-section h3 { margin: 0 0 8px 4px; font-size: 14px; color: var(--c-brand-green); font-weight: bold; }

        .result-box { 
            background-color: rgba(244, 241, 234, 0.6); padding: 14px; border-radius: 8px; min-height: 48px; 
            display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 8px; align-items: center;
            border: 1px solid var(--c-border); box-sizing: border-box; width: 100%; 
        }

        /* 읽기 전용 전체 단어집합 태그 */
        .readonly-tag {
            display: inline-flex;
            align-items: center;
            background-color: var(--c-tag-bg);
            color: var(--c-tag-text);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid rgba(165, 214, 167, 0.6);
        }

        .vector-container { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .vector-row { background: rgba(255, 255, 255, 0.6); border: 1px solid var(--c-border); border-radius: 6px; padding: 10px 12px; }
        
        .vector-row .sentence-summary { font-size: 12px; font-weight: bold; color: var(--c-brand-green); margin-bottom: 4px; }
        .vector-row .tokens-summary { font-size: 11px; color: var(--c-text-muted); margin-bottom: 6px; font-style: italic; }
        
        .vector-display {
            font-family: 'Consolas', monospace; font-size: 13px; background: #fff; padding: 6px 10px;
            border-radius: 4px; border: 1px solid rgba(44, 42, 41, 0.05); color: var(--c-vector-text); word-break: break-all;
        }

        .right-panel-content::-webkit-scrollbar, .textarea-list::-webkit-scrollbar { width: 6px; }
        .right-panel-content::-webkit-scrollbar-track, .textarea-list::-webkit-scrollbar-track { background: transparent; }
        .right-panel-content::-webkit-scrollbar-thumb, .textarea-list::-webkit-scrollbar-thumb { background: rgba(44, 42, 41, 0.15); border-radius: 3px; }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(251, 249, 244, 0.7);
            backdrop-filter: blur(8px);
            z-index: 5000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .loading-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(27, 67, 50, 0.1);
            border-left-color: var(--c-brand-green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        .loading-text {
            font-size: 15px;
            font-weight: bold;
            color: var(--c-brand-green);
            letter-spacing: 0.05em;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<canvas id="neural-canvas"></canvas>

<!-- Kiwi 엔진 로딩 레이어 -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">Kiwi 백엔드 엔진 형태소 분석 중...</div>
</div>

<nav class="top-navbar">
    <button onclick="if(document.referrer) { history.back(); } else { location.href='./index.html'; }" class="back-btn">← BACK</button>
    <div class="navbar-brand-text">SENTENCE VECTORIZER</div>
</nav>

<div class="main-layout">
    <div class="card left-panel">
        <div class="panel-title">
            <span>문장 입력 (100자 이내)</span>
            <div class="input-controls">
                <button class="control-btn" id="removeInputBtn" onclick="removeInputField()">- 제거</button>
                <button class="control-btn" id="addInputBtn" onclick="addInputField()">+ 추가</button>
            </div>
        </div>
        <div class="textarea-list" id="textareaList">
            <!-- 기본 3개 입력 영역 -->
            <div class="textarea-wrapper" id="wrapper_0">
                <span class="label">문장 1</span>
                <div class="textarea-inner">
                    <textarea id="input_0" maxlength="100" oninput="updateCharCount(0)"></textarea>
                    <div class="char-counter" id="counter_0">0/100</div>
                </div>
                <div class="sentence-vocab-box">
                    <div class="sentence-vocab-header">
                        <span class="vocab-title">단어집합</span>
                        <div class="add-mini-section">
                            <input type="text" id="add_input_0" class="add-mini-input" placeholder="원형 단어" onkeypress="if(event.key==='Enter') addWordToSentence(0)">
                            <button class="add-mini-btn" onclick="addWordToSentence(0)">추가</button>
                        </div>
                    </div>
                    <div class="vocab-tags" id="vocab_tags_0"><span style="color:#aaa;">분석 대기 중...</span></div>
                </div>
            </div>

            <div class="textarea-wrapper" id="wrapper_1">
                <span class="label">문장 2</span>
                <div class="textarea-inner">
                    <textarea id="input_1" maxlength="100" oninput="updateCharCount(1)"></textarea>
                    <div class="char-counter" id="counter_1">0/100</div>
                </div>
                <div class="sentence-vocab-box">
                    <div class="sentence-vocab-header">
                        <span class="vocab-title">단어집합</span>
                        <div class="add-mini-section">
                            <input type="text" id="add_input_1" class="add-mini-input" placeholder="원형 단어" onkeypress="if(event.key==='Enter') addWordToSentence(1)">
                            <button class="add-mini-btn" onclick="addWordToSentence(1)">추가</button>
                        </div>
                    </div>
                    <div class="vocab-tags" id="vocab_tags_1"><span style="color:#aaa;">분석 대기 중...</span></div>
                </div>
            </div>

            <div class="textarea-wrapper" id="wrapper_2">
                <span class="label">문장 3</span>
                <div class="textarea-inner">
                    <textarea id="input_2" maxlength="100" oninput="updateCharCount(2)"></textarea>
                    <div class="char-counter" id="counter_2">0/100</div>
                </div>
                <div class="sentence-vocab-box">
                    <div class="sentence-vocab-header">
                        <span class="vocab-title">단어집합</span>
                        <div class="add-mini-section">
                            <input type="text" id="add_input_2" class="add-mini-input" placeholder="원형 단어" onkeypress="if(event.key==='Enter') addWordToSentence(2)">
                            <button class="add-mini-btn" onclick="addWordToSentence(2)">추가</button>
                        </div>
                    </div>
                    <div class="vocab-tags" id="vocab_tags_2"><span style="color:#aaa;">분석 대기 중...</span></div>
                </div>
            </div>
        </div>
        <button class="run-btn" id="runBtn" onclick="processNLPWithLoading()">분석 실행 ⚡</button>
    </div>

    <div class="card right-panel">
        <div class="nav-group">
            <button id="tab_all" class="nav-btn active" onclick="switchTab('all')">전체보기</button>
            <button id="tab_1" class="nav-btn" onclick="switchTab('1')">1. 전체 단어집합</button>
            <button id="tab_2" class="nav-btn" onclick="switchTab('2')">2. 원-핫 벡터</button>
            <button id="tab_3" class="nav-btn" onclick="switchTab('3')">3. 빈도수 벡터</button>
        </div>

        <div class="right-panel-content">
            <div id="sec_1" class="result-section">
                <h3>1. 전체 단어집합</h3>
                <div class="result-box" id="vocabContainer"></div>
            </div>

            <div id="sec_2" class="result-section">
                <h3>2. 원-핫 벡터 (One-Hot Vector)</h3>
                <div class="result-box" style="display:block;">
                    <div class="vector-container" id="oneHotContainer"></div>
                </div>
            </div>

            <div id="sec_3" class="result-section">
                <h3>3. 빈도수 벡터 (Frequency Vector)</h3>
                <div class="result-box" style="display:block;">
                    <div class="vector-container" id="freqContainer"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const API_URL = 'https://math-render-apps-791425966280.asia-northeast3.run.app/api/analyze';

let inputCount = 3;
const MIN_INPUTS = 3;
const MAX_INPUTS = 10;

let vocabulary = []; // 합집합 (전체 단어집합)
let currentSentences = [];
let sentenceVocabMap = {}; // 각 문장 인덱스별 개별 단어집합 배열 { 0: ['읽다', '감동'], 1: [...] }
let oneHotMatrix = [];
let frequencyMatrix = [];

function updateCharCount(index) {
    const textarea = document.getElementById(`input_${index}`);
    const counter = document.getElementById(`counter_${index}`);
    counter.innerText = `${textarea.value.length}/100`;
}

function addInputField() {
    if (inputCount >= MAX_INPUTS) return;
    const idx = inputCount;
    const container = document.getElementById("textareaList");
    const wrapper = document.createElement("div");
    wrapper.className = "textarea-wrapper";
    wrapper.id = `wrapper_${idx}`;
    wrapper.innerHTML = `
        <span class="label">문장 ${idx + 1}</span>
        <div class="textarea-inner">
            <textarea id="input_${idx}" maxlength="100" oninput="updateCharCount(${idx})"></textarea>
            <div class="char-counter" id="counter_${idx}">0/100</div>
        </div>
        <div class="sentence-vocab-box">
            <div class="sentence-vocab-header">
                <span class="vocab-title">단어집합</span>
                <div class="add-mini-section">
                    <input type="text" id="add_input_${idx}" class="add-mini-input" placeholder="원형 단어" onkeypress="if(event.key==='Enter') addWordToSentence(${idx})">
                    <button class="add-mini-btn" onclick="addWordToSentence(${idx})">추가</button>
                </div>
            </div>
            <div class="vocab-tags" id="vocab_tags_${idx}"><span style="color:#aaa;">분석 대기 중...</span></div>
        </div>
    `;
    container.appendChild(wrapper);
    inputCount++;
    updateControlButtons();
    container.scrollTop = container.scrollHeight;
}

function removeInputField() {
    if (inputCount <= MIN_INPUTS) return;
    inputCount--;
    document.getElementById(`wrapper_${inputCount}`).remove();
    delete sentenceVocabMap[inputCount];
    updateControlButtons();
    recalculateUnionAndVectors();
}

function updateControlButtons() {
    document.getElementById("addInputBtn").disabled = (inputCount >= MAX_INPUTS);
    document.getElementById("removeInputBtn").disabled = (inputCount <= MIN_INPUTS);
}

function switchTab(tabId) {
    const tabs = ['all', '1', '2', '3'];
    tabs.forEach(t => {
        document.getElementById(`tab_${t}`).classList.remove('active');
        if(t !== 'all') document.getElementById(`sec_${t}`).classList.add('hidden');
    });
    document.getElementById(`tab_${tabId}`).classList.add('active');
    if (tabId === 'all') {
        tabs.forEach(t => { if(t !== 'all') document.getElementById(`sec_${t}`).classList.remove('hidden'); });
    } else {
        document.getElementById(`sec_${tabId}`).classList.remove('hidden');
    }
}

// ✨ 수정 및 개선된 백엔드 요청 함수
async function processNLPWithLoading() {
    const textFields = [];
    const activeIndices = [];
    
    // 입력창 중 내용이 있는 것만 수집 (인덱스 추적)
    for(let i = 0; i < inputCount; i++) {
        const val = document.getElementById(`input_${i}`).value.trim();
        if(val.length > 0) {
            textFields.push(val);
            activeIndices.push(i);
        }
    }

    if (textFields.length === 0) {
        alert("최소 하나 이상의 분석 문장을 입력해 주세요!");
        return;
    }

    currentSentences = textFields;
    const overlay = document.getElementById("loadingOverlay");
    overlay.classList.add("active");

    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                sentences: currentSentences,
                custom_vocab: []
            })
        });

        if (!response.ok) {
            throw new Error(`서버 응답 에러: ${response.status}`);
        }

        const data = await response.json();
        const processedCorpus = data.processed_corpus || [];

        // 문장별 단어집합 맵 초기화
        sentenceVocabMap = {};
        
        // 백엔드에서 복원되어 온 원형 텍스트(processedCorpus) 파싱
        activeIndices.forEach((fieldIdx, arrayIdx) => {
            const corpusStr = processedCorpus[arrayIdx] || "";
            // 공백 기준으로 나누고 연속 공백이나 empty 값 필터링
            const rawWords = corpusStr.trim().split(/\s+/).filter(w => w.length > 0);
            
            // 순서 보장 중복 제거
            const uniqueWords = [];
            rawWords.forEach(w => {
                if (!uniqueWords.includes(w)) uniqueWords.push(w);
            });

            sentenceVocabMap[fieldIdx] = uniqueWords;
        });

        renderAllSentenceVocabs();
        recalculateUnionAndVectors();

    } catch (e) {
        console.error(e);
        alert("Kiwi 서버 통신 중 오류가 발생했습니다. (서버 준비 상태를 확인해 주세요)");
    } finally {
        overlay.classList.remove("active");
    }
}

// 개별 문장에 단어 추가
function addWordToSentence(sentenceIdx) {
    const input = document.getElementById(`add_input_${sentenceIdx}`);
    const word = input.value.trim();
    if (!word) return;

    if (!sentenceVocabMap[sentenceIdx]) {
        sentenceVocabMap[sentenceIdx] = [];
    }

    if (!sentenceVocabMap[sentenceIdx].includes(word)) {
        sentenceVocabMap[sentenceIdx].push(word);
        renderSentenceVocab(sentenceIdx);
        recalculateUnionAndVectors();
    }
    input.value = "";
}

// ✏️ 개별 문장의 단어 수정 (인덱스 기준)
function updateWordInSentence(sentenceIdx, wordIdx, newValue) {
    const cleanValue = newValue.trim();
    if (!sentenceVocabMap[sentenceIdx]) return;

    if (cleanValue) {
        sentenceVocabMap[sentenceIdx][wordIdx] = cleanValue;
    } else {
        sentenceVocabMap[sentenceIdx].splice(wordIdx, 1);
    }
    renderSentenceVocab(sentenceIdx);
    recalculateUnionAndVectors();
}

// 개별 문장에서 단어 삭제
function deleteWordFromSentence(sentenceIdx, wordIdx) {
    if (sentenceVocabMap[sentenceIdx]) {
        sentenceVocabMap[sentenceIdx].splice(wordIdx, 1);
        renderSentenceVocab(sentenceIdx);
        recalculateUnionAndVectors();
    }
}

// 좌측 개별 문장 단어집합 렌더링 (편집창 포함)
function renderSentenceVocab(i) {
    const tagContainer = document.getElementById(`vocab_tags_${i}`);
    const words = sentenceVocabMap[i] || [];

    if (words.length === 0) {
        tagContainer.innerHTML = "<span style='color:#aaa;'>단어 없음</span>";
    } else {
        tagContainer.innerHTML = words.map((w, wIdx) => `
            <span class="mini-tag">
                <input type="text" class="mini-tag-input" value="${w}" 
                       onchange="updateWordInSentence(${i}, ${wIdx}, this.value)"
                       style="width: ${Math.max(w.length * 11, 35)}px;">
                <span class="mini-tag-delete" onclick="deleteWordFromSentence(${i}, ${wIdx})">×</span>
            </span>
        `).join("");
    }
}

function renderAllSentenceVocabs() {
    for (let i = 0; i < inputCount; i++) {
        renderSentenceVocab(i);
    }
}

// 전체 합집합 단어집합 및 벡터 재계산
function recalculateUnionAndVectors() {
    const unionSet = new Set();
    Object.values(sentenceVocabMap).forEach(list => {
        list.forEach(w => unionSet.add(w));
    });

    vocabulary = Array.from(unionSet).sort();

    // 벡터 행렬 생성
    oneHotMatrix = [];
    frequencyMatrix = [];

    for (let i = 0; i < inputCount; i++) {
        const inputVal = document.getElementById(`input_${i}`)?.value.trim();
        if (!inputVal) continue;

        const wordList = sentenceVocabMap[i] || [];
        const fVec = new Array(vocabulary.length).fill(0);
        
        wordList.forEach(w => {
            const idx = vocabulary.indexOf(w);
            if (idx !== -1) fVec[idx]++;
        });

        const ohVec = fVec.map(v => v > 0 ? 1 : 0);

        frequencyMatrix.push(fVec);
        oneHotMatrix.push(ohVec);
    }

    renderReadonlyVocab();
    renderVectorDisplays();
}

// 우측 읽기 전용 전체 단어집합 렌더링
function renderReadonlyVocab() {
    const container = document.getElementById("vocabContainer");
    if (vocabulary.length === 0) {
        container.innerHTML = "<span style='color:#aaa;'>전체 단어 집합이 비어 있습니다.</span>";
        return;
    }

    container.innerHTML = vocabulary.map(word => `
        <span class="readonly-tag">${word}</span>
    `).join("");
}

function renderVectorDisplays() {
    const oneHotContainer = document.getElementById("oneHotContainer");
    const freqContainer = document.getElementById("freqContainer");
    
    oneHotContainer.innerHTML = "";
    freqContainer.innerHTML = "";

    if(vocabulary.length === 0) {
        oneHotContainer.innerHTML = "단어 집합이 비어있어 변환이 취소되었습니다.";
        freqContainer.innerHTML = "단어 집합이 비어있어 변환이 취소되었습니다.";
        return;
    }

    let vecIdx = 0;
    for (let i = 0; i < inputCount; i++) {
        const sentence = document.getElementById(`input_${i}`)?.value.trim();
        if (!sentence) continue;

        const currentWords = sentenceVocabMap[i] || [];
        const tokensStr = currentWords.join(", ");
        const ohVec = oneHotMatrix[vecIdx] || [];
        const fVec = frequencyMatrix[vecIdx] || [];
        vecIdx++;

        const ohRow = document.createElement("div");
        ohRow.className = "vector-row";
        ohRow.innerHTML = `
            <div class="sentence-summary">문장 ${i + 1}: "${sentence}"</div>
            <div class="tokens-summary">→ 추출 원형 단어 리스트: [ ${tokensStr} ]</div>
            <div class="vector-display">[ ${ohVec.join(", ")} ]</div>
        `;
        oneHotContainer.appendChild(ohRow);

        const fRow = document.createElement("div");
        fRow.className = "vector-row";
        fRow.innerHTML = `
            <div class="sentence-summary">문장 ${i + 1}: "${sentence}"</div>
            <div class="tokens-summary">→ 추출 원형 단어 리스트: [ ${tokensStr} ]</div>
            <div class="vector-display">[ ${fVec.join(", ")} ]</div>
        `;
        freqContainer.appendChild(fRow);
    }
}

// 배경 신경망 애니메이션
const bgCanvas = document.getElementById('neural-canvas');
const bgCtx = bgCanvas.getContext('2d');
let particles = [];
const mouse = { x: null, y: null, radius: 150 };

function resizeBgCanvas() {
    bgCanvas.width = window.innerWidth;
    bgCanvas.height = window.innerHeight;
    initParticles();
}

class Particle {
    constructor() {
        this.x = Math.random() * bgCanvas.width;
        this.y = Math.random() * bgCanvas.height;
        this.vx = (Math.random() - 0.5) * 0.35;
        this.vy = (Math.random() - 0.5) * 0.35;
        this.radius = Math.random() * 2 + 1.5; 
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        if (this.x < 0 || this.x > bgCanvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > bgCanvas.height) this.vy *= -1;
        let dx = mouse.x - this.x; let dy = mouse.y - this.y;
        let distance = Math.sqrt(dx * dx + dy * dy);
        if (distance < mouse.radius) {
            const force = (mouse.radius - distance) / mouse.radius;
            this.x -= dx * force * 0.03; this.y -= dy * force * 0.03;
        }
    }
    draw() {
        bgCtx.beginPath(); bgCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        bgCtx.fillStyle = 'rgba(27, 67, 50, 0.15)'; bgCtx.fill();
    }
}

function initParticles() {
    particles = [];
    const particleCount = Math.floor((bgCanvas.width * bgCanvas.height) / 9000);
    for (let i = 0; i < particleCount; i++) particles.push(new Particle());
}

function animateBg() {
    bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
    for (let i = 0; i < particles.length; i++) {
        particles[i].update(); particles[i].draw();
        for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x; const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 110) {
                bgCtx.beginPath(); bgCtx.moveTo(particles[i].x, particles[i].y); bgCtx.lineTo(particles[j].x, particles[j].y);
                bgCtx.strokeStyle = `rgba(27, 67, 50, ${0.08 * (1 - dist / 110)})`; bgCtx.lineWidth = 1.0; bgCtx.stroke();
            }
        }
    }
    requestAnimationFrame(animateBg);
}

window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
window.addEventListener('resize', resizeBgCanvas);

window.addEventListener('DOMContentLoaded', () => {
    resizeBgCanvas();
    animateBg();
    updateControlButtons();
});
</script>
