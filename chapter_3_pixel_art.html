<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>픽셀 아트 & 이미지 처리 스튜디오</title>
    <style>
        :root {
            --c-bg-main: #FBF9F4; 
            --c-bg-card: rgba(255, 255, 255, 0.73); 
            --c-text-main: #2C2A29;
            --c-text-muted: #7D7569;
            --c-border: rgba(44, 42, 41, 0.1);
            --c-accent: #2383E2;
            --c-brand-green: #1B4332;
            --c-tag-bg: #E8F5E9;
            --c-tab-bg: #F4F1EA;
            --c-removed-bg: #FFEBEE;
            --c-removed-text: #C62828;

            /* ★ 4개 격자가 공유하는 한 변의 길이 (JS가 창 크기에 맞춰 갱신) */
            --grid-size: 300px;
            --grid-gap: 2px;
            /* ★ 예시 갤러리 미리보기 한 변 (JS가 갱신) */
            --preview-size: 110px;
            /* ★ 채널 카드의 'Red 채널' 제목 높이만큼 캔버스를 내려 정렬 (JS가 갱신) */
            --canvas-offset: 25px;
        }

        /* 화면 크기에 맞춰 가득 차도록 반응형 바디 설정 */
        body {
            font-family: 'Malgun Gothic', -apple-system, sans-serif;
            background-color: var(--c-bg-main);
            color: var(--c-text-main);
            margin: 0;
            padding: 0 10px 10px; /* 상단은 네비게이션 바가 차지 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;   /* ★ 위쪽부터 채우기 */
            letter-spacing: 0.03em;
            position: relative;
            box-sizing: border-box;

            /* ★ 창이 이보다 작아지면 줄어들지 않고 스크롤바가 생김 */
            min-width: 1200px;
            min-height: 760px;
            height: auto;
            /* overflow: hidden 제거 -> 문서 스크롤 허용 */
        }

        /* 배경 신경망 Canvas */
        #neural-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* 상단 네비게이션 바 */
        .top-navbar {
            position: sticky;    /* ★ fixed -> sticky : 가로 스크롤을 따라감 */
            top: 0;
            width: calc(100% + 20px);   /* body 좌우 여백까지 덮도록 */
            margin: 0 -10px 10px;
            flex-shrink: 0;
            background-color: rgba(251, 249, 244, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--c-border);
            z-index: 1000;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            height: 55px;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--c-brand-green);
            font-family: "Consolas", monospace;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.15em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            transition: all 0.2s ease;
        }
        .back-btn:hover {
            transform: translateX(-3px);
            opacity: 0.8;
        }

        .navbar-brand-text {
            font-size: 13px; 
            font-weight: bold; 
            color: var(--c-brand-green); 
            letter-spacing: 0.15em; 
            text-transform: uppercase;
        }

        /* 메인 레이아웃 */
        .main-layout {
            display: flex;
            width: 100%;
            height: auto;                        /* ★ JS가 내용 높이로 지정 */
            flex-shrink: 0;
            align-items: stretch;
            gap: 14px;
            position: relative;
            z-index: 10;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--c-bg-card);
            border: 1px solid var(--c-border);
            border-radius: 12px;
            padding: 14px;
            box-sizing: border-box;
            backdrop-filter: blur(6px);
            box-shadow: 0 10px 30px rgba(44, 42, 41, 0.03);
            display: flex;
            flex-direction: column;
        }

        .section-title {
            font-size: 13px;
            font-weight: bold;
            color: var(--c-brand-green);
            margin-bottom: 8px;
            letter-spacing: 0.05em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            height: 20px;
            white-space: nowrap;   /* ★ 두 줄로 접히지 않도록 */
        }

        /* ★ 격자 1개 : 격자 3개 = 1 : 3 비율로 패널 너비 배분 */
        .left-panel {
            flex: 1 1 0;
            min-width: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .right-panel {
            flex: 3 1 0;
            min-width: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .grid-container {
            width: 100%;
            flex: 0 0 auto;      /* ★ 남는 공간을 먹지 않음 */
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            border: 1px solid var(--c-border);
            /* ★ 위쪽 여백 = 기본 10px + 채널 제목 높이 */
            padding: calc(10px + var(--canvas-offset)) 10px 10px;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* ★ 캔버스 격자 : 채널 격자와 완전히 동일한 크기·간격 */
        #pixel-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: var(--grid-gap);

            width: var(--grid-size);
            height: var(--grid-size);
            aspect-ratio: 1 / 1;
            flex: 0 0 auto;

            background-color: #DDD;
            border: 2px solid var(--c-brand-green);
            border-radius: 6px;
            overflow: hidden;
            box-sizing: content-box; /* 테두리가 크기에 영향 주지 않도록 */
        }

        .pixel-cell {
            background-color: #FFFFFF;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .pixel-cell:hover {
            opacity: 0.85;
        }
        .pixel-cell.selected {
            outline: 3px solid var(--c-accent);
            outline-offset: -3px;
            z-index: 2;
        }

        /* 좌측 슬라이더 컨트롤 박스 */
        .control-box {
            background: rgba(244, 241, 234, 0.6);
            border: 1px solid var(--c-border);
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            min-height: 120px;   /* ★ 고정 높이 -> 최소 높이 */
            flex: 1 1 auto;      /* ★ 자투리 공간은 여기서 흡수 */
            box-sizing: border-box;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: bold;
        }

        .slider-row label {
            width: 15px;
        }

        .slider-row input[type="range"] {
            flex: 1;
            min-width: 0;
            accent-color: var(--c-brand-green);
        }

        .val-input {
            width: 42px;
            height: 22px;
            text-align: center;
            font-family: 'Consolas', monospace;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid var(--c-border);
            border-radius: 4px;
            background: #FFFFFF;
            color: var(--c-text-main);
            flex-shrink: 0;
        }

        .pos-indicator {
            font-size: 11px;
            font-weight: bold;
            color: var(--c-brand-green);
            text-align: right;
            padding-left: 6px;
            white-space: nowrap;
            border-left: 1px solid var(--c-border);
        }

        .channels-container {
            width: 100%;
            flex: 0 0 auto;      /* ★ 남는 공간을 먹지 않음 */
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .channel-card {
            background: rgba(244, 241, 234, 0.4);
            border: 1px solid var(--c-border);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: auto;        /* ★ 내용 높이만큼만 */
            min-width: 0;
            box-sizing: border-box;
            overflow: hidden;
        }

        .grid-box-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            height: auto;        /* ★ 내용 높이만큼만 */
        }

        .grid-box-container h4 {
            margin: 0 0 6px 0;
            font-size: 13px;
            color: var(--c-brand-green);
            text-align: center;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* ★ 채널 격자 : 캔버스 격자와 완전히 동일한 크기·간격 */
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: var(--grid-gap);

            width: var(--grid-size);
            height: var(--grid-size);
            aspect-ratio: 1 / 1;
            flex: 0 0 auto;

            background-color: #DDD;
            border: 2px solid var(--c-brand-green);
            border-radius: 6px;
            overflow: hidden;
            box-sizing: content-box; /* 캔버스와 동일 조건 */
        }

        .channel-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            /* ★ 채널 행렬 숫자만 11px 고정 */
            font-size: 11px;
            line-height: 1;
            font-weight: bold;
            font-family: 'Consolas', monospace;
            user-select: none;
            overflow: hidden;
        }

        /* 하단 툴바 */
        .action-toolbar {
            background: rgba(244, 241, 234, 0.6);
            border: 1px solid var(--c-border);
            border-radius: 8px;
            padding: 14px;              /* ★ 상하 여백을 좌우와 동일하게 */
            display: flex;
            align-items: stretch;       /* ★ 버튼이 세로를 가득 채움 */
            justify-content: stretch;
            gap: 10px;
            min-height: 120px;          /* ★ RGB 조절 박스와 동일 */    /* ★ 버튼(50px) + 여백만큼만 */
            flex: 1 1 auto;      /* ★ 자투리 공간은 여기서 흡수 */
            box-sizing: border-box;
        }

        .btn-action, .btn-brightness-group {
            flex: 1 1 0;         /* ★ 남는 공간 없이 툴바를 가득 채움 */
            min-width: 0;
            height: auto;        /* ★ 툴바 높이에 맞춰 세로로 늘어남 */
            box-sizing: border-box;
            font-size: 15px;     /* ★ 버튼이 커진 만큼 글자도 크게 */
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.03em;
            white-space: nowrap;   /* ★ 두 줄로 접히지 않도록 */
        }

        .btn-primary { 
            background: var(--c-brand-green); 
            color: white; 
            box-shadow: 0 4px 12px rgba(27, 67, 50, 0.15); 
        }
        .btn-primary:hover { opacity: 0.9; }

        .btn-secondary { 
            background: var(--c-tab-bg); 
            color: var(--c-text-main); 
            border: 1px solid var(--c-border); 
        }
        .btn-secondary:hover { background: #e8e4d9; }

        .btn-brightness-group {
            flex-direction: column;   /* ★ 라벨/입력칸을 2줄로 -> 폭 절약 */
            background: var(--c-tab-bg);
            border: 1px solid var(--c-border);
            padding: 8px;
            gap: 6px;
            justify-content: center;   /* ★ 글자 + 입력칸 가운데 정렬 */
            cursor: pointer;           /* ★ 박스 전체가 클릭 영역 */
        }

        .btn-brightness-label {
            font-size: 15px;
            font-weight: bold;
            color: var(--c-text-main);
            white-space: nowrap;   /* ★ 두 줄로 접히지 않도록 */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            pointer-events: none;  /* ★ 클릭이 박스 전체로 전달되도록 */
        }
        .btn-brightness-group:hover {
            background: #e8e4d9;
        }

        .num-input-inline {
            width: 50px;
            height: 32px;
            border: 1px solid var(--c-border);
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
            font-family: 'Consolas', monospace;
            background: #FFFFFF;
            color: var(--c-text-main);
        }

        /* ★ 스포이드 버튼: 라벨 + 커서 아래 색 실시간 표시 */
        #btn-eyedropper {
            flex-direction: column;   /* ★ 라벨/RGB표시를 2줄로 -> 폭 절약 */
            gap: 5px;
        }

        .ed-label {
            white-space: nowrap;
        }

        .ed-readout {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 3px 6px;
            border: 1px solid var(--c-border);
            border-radius: 4px;
            background: #FFFFFF;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            font-weight: bold;
            color: var(--c-text-muted);
            white-space: nowrap;
        }

        #btn-eyedropper.picking .ed-readout {
            color: var(--c-text-main);
            border-color: transparent;
        }

        .ed-swatch {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            border: 1px solid var(--c-border);
            border-radius: 3px;
            background: #FFFFFF;
        }

        /* ★ 스포이드 모드 */
        .btn-action.picking {
            background: var(--c-brand-green);
            color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(35, 131, 226, 0.3);
        }

        body.picking-color .pixel-cell,
        body.picking-color .channel-cell,
        body.picking-color .preset-grid > div {
            cursor: crosshair;
        }

        .pick-hint {
            font-size: 11px;
            font-weight: bold;
            color: var(--c-accent);
            letter-spacing: 0;
            white-space: nowrap;
        }

        /* ★ 하단 예시 갤러리 */
        .gallery {
            width: 100%;
            margin-top: 14px;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }

        .gallery-hint {
            font-size: 11px;
            font-weight: normal;
            color: var(--c-text-muted);
            letter-spacing: 0;
        }

        .preset-row {
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 6px;
        }

        /* 공간이 남으면 가운데 정렬, 넘치면 양끝이 잘리지 않도록 하는 스페이서 */
        .preset-row::before,
        .preset-row::after {
            content: '';
            margin: auto;
        }

        .preset-row::-webkit-scrollbar { height: 6px; }
        .preset-row::-webkit-scrollbar-thumb {
            background: rgba(27, 67, 50, 0.25);
            border-radius: 3px;
        }
        .preset-row::-webkit-scrollbar-track { background: transparent; }

        .preset-item {
            flex: 0 0 auto;      /* ★ 개수가 많아도 찌그러지지 않음 */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            font-family: inherit;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 1px;

            width: var(--preview-size);
            height: var(--preview-size);
            aspect-ratio: 1 / 1;      /* ★ 정사각형 유지 */

            background-color: #DDD;
            border: 2px solid var(--c-brand-green);
            border-radius: 6px;
            overflow: hidden;
            box-sizing: content-box;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .preset-item:hover .preset-grid {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(27, 67, 50, 0.18);
        }
        .preset-item:focus-visible .preset-grid {
            outline: 3px solid var(--c-accent);
            outline-offset: 2px;
        }

        .preset-label {
            font-size: 11px;
            font-weight: bold;
            color: var(--c-brand-green);
            white-space: nowrap;
        }

        @media (prefers-reduced-motion: reduce) {
            .preset-grid { transition: none; }
            .preset-item:hover .preset-grid { transform: none; }
        }
    </style>
</head>
<body>

<canvas id="neural-canvas"></canvas>

<!-- 상단 네비게이션 바 -->
<nav class="top-navbar">
    <button onclick="if(document.referrer) { history.back(); } else { location.href='./index.html'; }" class="back-btn">
        ← BACK
    </button>
    <div class="navbar-brand-text">
        PIXEL ART
    </div>
</nav>

<div class="main-layout">
    <!-- 좌측 패널: 10x10 픽셀 아트 캔버스 및 RGB 팔레트 -->
    <div class="card left-panel">
        <div class="section-title">
            <span>🎨 캔버스 (10 × 10)</span>
            <span id="pick-hint" class="pick-hint"></span>
        </div>
        <div class="grid-container">
            <div id="pixel-grid"></div>
        </div>
        
        <div class="control-box">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 11px; font-weight: bold; color: var(--c-brand-green);">RGB 색상 조절</span>
                <span id="pos-display" class="pos-indicator">선택: 1행, 1열</span>
            </div>
            
            <div class="slider-row" style="color: #C62828;">
                <label>R</label>
                <input type="range" id="slider-r" min="0" max="255" value="255" oninput="syncColorInput('r', this.value)">
                <input type="number" id="num-r" class="val-input" min="0" max="255" value="255" oninput="syncColorSlider('r', this.value)">
            </div>
            <div class="slider-row" style="color: #2E7D32;">
                <label>G</label>
                <input type="range" id="slider-g" min="0" max="255" value="255" oninput="syncColorInput('g', this.value)">
                <input type="number" id="num-g" class="val-input" min="0" max="255" value="255" oninput="syncColorSlider('g', this.value)">
            </div>
            <div class="slider-row" style="color: #1565C0;">
                <label>B</label>
                <input type="range" id="slider-b" min="0" max="255" value="255" oninput="syncColorInput('b', this.value)">
                <input type="number" id="num-b" class="val-input" min="0" max="255" value="255" oninput="syncColorSlider('b', this.value)">
            </div>
        </div>
    </div>

    <!-- 우측 패널: R, G, B 채널 행렬 및 툴바 -->
    <div class="card right-panel">
        <div class="section-title">
            <span>🔍 R, G, B 채널 행렬</span>
        </div>
        
        <div class="channels-container">
            <div class="channel-card">
                <div class="grid-box-container">
                    <h4>Red 채널</h4>
                    <div id="channel-r" class="channel-grid"></div>
                </div>
            </div>
            <div class="channel-card">
                <div class="grid-box-container">
                    <h4>Green 채널</h4>
                    <div id="channel-g" class="channel-grid"></div>
                </div>
            </div>
            <div class="channel-card">
                <div class="grid-box-container">
                    <h4>Blue 채널</h4>
                    <div id="channel-b" class="channel-grid"></div>
                </div>
            </div>
        </div>

        <div class="action-toolbar">
            <button id="btn-eyedropper" class="btn-action btn-secondary" onclick="toggleEyedropper()">
                <span class="ed-label">💧 스포이드</span>
                <span class="ed-readout">
                    <span id="ed-swatch" class="ed-swatch"></span>
                    <span id="ed-value">---,---,---</span>
                </span>
            </button>
            <button class="btn-action btn-secondary" onclick="applyGrayscale()">◐ 흑백 변환</button>
            
            <div class="btn-brightness-group" onclick="applyBrightness()" title="입력한 값만큼 모든 셀의 R, G, B를 더합니다 (-255 ~ 255)">
                <span class="btn-brightness-label">☀️ 밝기 조절</span>
                <input type="number" id="brightness-val" class="num-input-inline"
                       min="-255" max="255" step="1" value="0"
                       onclick="event.stopPropagation()"
                       onkeydown="if(event.key==='Enter'){ event.preventDefault(); applyBrightness(); }">
            </div>

            <button class="btn-action btn-secondary" onclick="restoreOriginal()">🔄 원래대로</button>
            <button class="btn-action btn-primary" onclick="downloadImage()">💾 다운로드</button>
        </div>
    </div>

<script>
    const GRID_SIZE = 10;
    let pixelData = Array.from({ length: GRID_SIZE }, () => 
        Array.from({ length: GRID_SIZE }, () => [255, 255, 255])
    );
    let originalPixelData = JSON.parse(JSON.stringify(pixelData));

    let selectedRow = 0;
    let selectedCol = 0;

    document.addEventListener('DOMContentLoaded', () => {
        initGrids();
        initPresets();
        selectPixel(0, 0);
        renderAll();
        fitGrids();
    });

    /* ★★ 4개 격자의 한 변 길이를 하나로 통일해서 계산 ★★
       - 가로: 캔버스 영역 / 채널 카드 영역의 실제 폭 중 좁은 쪽
       - 세로: 화면 높이에서 제목·하단바 등 고정 요소를 뺀 예산
       계산이 끝나면 레이아웃 높이를 "내용에 딱 맞는 높이"로 지정해서
       남는 여백이 전부 화면 최하단으로 밀려나도록 합니다. */
    function fitGrids() {
        const gridContainer = document.querySelector('.grid-container');
        const channelCard = document.querySelector('.channel-card');
        const layout = document.querySelector('.main-layout');
        if (!gridContainer || !channelCard || !layout) return;

        const px = (v) => parseFloat(v) || 0;

        const root = document.documentElement;

        // --- 채널 제목 높이를 캔버스 위쪽 여백으로 반영 (좌/우 구조를 일치시킴) ---
        const heading = channelCard.querySelector('h4');
        const headingH = heading ? heading.offsetHeight + 6 : 0;  // h4 + 아래 여백
        if (root.style.getPropertyValue('--canvas-offset') !== headingH + 'px') {
            root.style.setProperty('--canvas-offset', headingH + 'px');
        }

        // --- 가로 가용 폭 (위 변수 반영 후 측정) ---
        const gcs = getComputedStyle(gridContainer);
        const leftW = gridContainer.clientWidth - px(gcs.paddingLeft) - px(gcs.paddingRight);

        const ccs = getComputedStyle(channelCard);
        const rightW = channelCard.clientWidth - px(ccs.paddingLeft) - px(ccs.paddingRight);

        const GRID_BORDER   = 4;    // 격자 테두리 2px × 2면
        const TITLE         = 28;   // 섹션 제목 20px + 아래 여백 8px
        const PANEL_GAP     = 20;   // 패널 내부 요소 간격 10px × 2군데
        const CARD_CHROME   = 30;   // 카드 패딩 14×2 + 테두리 2
        const BOTTOM_MIN    = 120;  // ★ RGB 슬라이더 박스 = 하단 버튼 바 (동일 높이)
        const CONTROL_MIN   = BOTTOM_MIN;
        const TOOLBAR_MIN   = BOTTOM_MIN;

        const gcChrome = px(gcs.paddingTop) + px(gcs.paddingBottom) + 2;              // 캔버스 컨테이너
        const ccChrome = px(ccs.paddingTop) + px(ccs.paddingBottom) + 2 + headingH;   // 채널 카드

        // 하단 예시 갤러리가 쓸 세로 공간
        const GALLERY_GAP    = 14;   // 레이아웃과 갤러리 사이 간격
        const GALLERY_CHROME = 30 + TITLE + 22 + 8;  // 카드 여백 + 제목 + 이름표 + 스크롤바
        const PREVIEW_BORDER = 4;
        const PREVIEW_MIN    = 60;
        const PREVIEW_MAX    = 150;
        const galleryReserve = GALLERY_GAP + GALLERY_CHROME + PREVIEW_BORDER + PREVIEW_MIN;

        /* ★ 창이 최소 크기보다 작아져도 레이아웃은 줄이지 않는다.
           대신 문서에 스크롤바가 생겨 원래 크기를 유지한다. (body min-height와 동일 값) */
        const MIN_VIEW_H = 760;
        const NAVBAR_BLOCK = 80;   // 상단바 55 + 아래 여백 10 + 하단 여백 10 + 여유
        const viewH = Math.max(window.innerHeight, MIN_VIEW_H);
        const maxH = viewH - NAVBAR_BLOCK;
        const fixedLeft  = gcChrome + CONTROL_MIN;
        const fixedRight = ccChrome + TOOLBAR_MIN;
        const hBudget = maxH - galleryReserve - CARD_CHROME - TITLE - PANEL_GAP - GRID_BORDER
                             - Math.max(fixedLeft, fixedRight);

        // --- 네 격자가 공유할 한 변의 길이 ---
        let size = Math.min(leftW - GRID_BORDER, rightW - GRID_BORDER, hBudget);
        size = Math.floor(size / 10) * 10;   // 칸이 딱 떨어지도록
        size = Math.max(size, 120);
        if (root.style.getPropertyValue('--grid-size') !== size + 'px') {
            root.style.setProperty('--grid-size', size + 'px');
        }

        // --- 내용에 딱 맞는 레이아웃 높이 (여백은 아래로) ---
        const needed = size + GRID_BORDER + CARD_CHROME + TITLE + PANEL_GAP
                            + Math.max(fixedLeft, fixedRight);
        const layoutH = Math.min(needed, maxH - galleryReserve);
        const h = layoutH + 'px';
        if (layout.style.height !== h) layout.style.height = h;

        // --- 남은 세로 공간을 갤러리 미리보기가 채우도록 ---
        const gallery = document.querySelector('.gallery');
        if (gallery) {
            const gs = getComputedStyle(gallery);
            const galleryInnerW = gallery.clientWidth - px(gs.paddingLeft) - px(gs.paddingRight);
            const PRESET_GAP = 12;
            const n = PRESETS.length;   /* ★ 예시 개수에 맞춰 자동 계산 */
            const widthCap = (galleryInnerW - PRESET_GAP * (n - 1)) / n - PREVIEW_BORDER;

            const restH = maxH - layoutH - GALLERY_GAP - GALLERY_CHROME - PREVIEW_BORDER;

            let preview = Math.min(restH, widthCap, PREVIEW_MAX);
            preview = Math.floor(preview / 10) * 10;
            preview = Math.max(preview, PREVIEW_MIN);

            if (root.style.getPropertyValue('--preview-size') !== preview + 'px') {
                root.style.setProperty('--preview-size', preview + 'px');
            }
        }
    }

    window.addEventListener('resize', fitGrids);
    if (window.ResizeObserver) {
        const layoutEl = document.querySelector('.main-layout');
        if (layoutEl) new ResizeObserver(() => fitGrids()).observe(layoutEl);

    function hexToRgb(hex) {
        return [
            parseInt(hex.slice(1, 3), 16),
            parseInt(hex.slice(3, 5), 16),
            parseInt(hex.slice(5, 7), 16)
        ];
    }

    function presetToData(preset) {
        return preset.rows.map(row =>
            Array.from(row, ch => hexToRgb(preset.palette[ch] || '#FFFFFF'))
        );
    }

    function initPresets() {
        const row = document.getElementById('preset-row');
        if (!row) return;
        row.innerHTML = '';

        PRESETS.forEach((preset, idx) => {
            const data = presetToData(preset);

            const item = document.createElement('button');
            item.className = 'preset-item';
            item.type = 'button';
            item.title = `${preset.name} 그리기`;

            const grid = document.createElement('div');
            grid.className = 'preset-grid';
            data.forEach(rowData => {
                rowData.forEach(([r, g, b]) => {
                    const cell = document.createElement('div');
                    cell.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
                    grid.appendChild(cell);
                });
            });

            const label = document.createElement('span');
            label.className = 'preset-label';
            label.innerText = preset.name;

            item.appendChild(grid);
            item.appendChild(label);
            item.addEventListener('click', () => applyPreset(idx));
            row.appendChild(item);
        });
    }

    function applyPreset(idx) {
        pixelData = presetToData(PRESETS[idx]);
        originalPixelData = JSON.parse(JSON.stringify(pixelData));
        selectPixel(selectedRow, selectedCol);
        renderAll();
    }


    /* ★★ 스포이드 ★★
       1) 캔버스에서 셀을 선택 → 2) 스포이드 버튼 클릭 → 3) 화면의 색을 클릭
       캔버스 셀 / 채널 행렬 칸 / 예시 갤러리 미리보기의 색을 모두 뽑을 수 있습니다.
       ESC 또는 버튼 재클릭으로 취소. */
    const PICKABLE = '.pixel-cell, .channel-cell, .preset-grid > div';
    let isPicking = false;

    function toggleEyedropper() {
        isPicking ? stopPicking() : startPicking();
    }

    function startPicking() {
        isPicking = true;
        document.body.classList.add('picking-color');
        document.getElementById('btn-eyedropper').classList.add('picking');
        document.getElementById('pick-hint').innerText =
            `${selectedRow + 1}행 ${selectedCol + 1}열에 넣을 색을 클릭하세요 (ESC 취소)`;

        // 캡처 단계에서 가로채야 셀 선택·예시 불러오기가 대신 실행되지 않음
        document.addEventListener('click', handlePick, true);
        document.addEventListener('keydown', handlePickKey);
    }

    function stopPicking() {
        isPicking = false;
        document.body.classList.remove('picking-color');
        document.getElementById('btn-eyedropper').classList.remove('picking');
        document.getElementById('pick-hint').innerText = '';
        document.removeEventListener('click', handlePick, true);
        document.removeEventListener('keydown', handlePickKey);
    }

    function handlePickKey(e) {
        if (e.key === 'Escape') stopPicking();
    }

    function handlePick(e) {
        const target = e.target.closest ? e.target.closest(PICKABLE) : null;

        // 스포이드 모드 중에는 원래 클릭 동작(셀 선택 등)을 막는다
        e.preventDefault();
        e.stopPropagation();

        if (target) {
            const rgb = parseRgb(getComputedStyle(target).backgroundColor);
            if (rgb) {
                pixelData[selectedRow][selectedCol] = rgb;
                originalPixelData[selectedRow][selectedCol] = rgb.slice();
                selectPixel(selectedRow, selectedCol);   // 슬라이더·숫자 동기화
                renderAll();
                updateReadout(rgb);
            }
        }
        stopPicking();   // 색을 뽑았거나 빈 곳을 눌렀으면 모드 종료
    }

    function parseRgb(str) {
        const nums = str.match(/\d+(\.\d+)?/g);
        if (!nums || nums.length < 3) return null;
        return nums.slice(0, 3).map(v => Math.round(parseFloat(v)));
    }

    /* ★ 커서가 색 위를 지날 때마다 RGB 값을 스포이드 버튼에 표시 */
    const EMPTY_READOUT = '---,---,---';

    function updateReadout(rgb) {
        const swatch = document.getElementById('ed-swatch');
        const value = document.getElementById('ed-value');
        if (!swatch || !value) return;

        if (rgb) {
            swatch.style.backgroundColor = `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
            value.innerText = rgb.map(v => String(v).padStart(3, ' ')).join(',');
        } else {
            swatch.style.backgroundColor = '#FFFFFF';
            value.innerText = EMPTY_READOUT;
        }
    }

    function handleHoverColor(e) {
        const target = e.target.closest ? e.target.closest(PICKABLE) : null;
        updateReadout(target ? parseRgb(getComputedStyle(target).backgroundColor) : null);
    }

    document.addEventListener('mouseover', handleHoverColor);

    function initGrids() {
        const mainGrid = document.getElementById('pixel-grid');
        const gridR = document.getElementById('channel-r');
        const gridG = document.getElementById('channel-g');
        const gridB = document.getElementById('channel-b');

        mainGrid.innerHTML = '';
        gridR.innerHTML = '';
        gridG.innerHTML = '';
        gridB.innerHTML = '';

        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                const cell = document.createElement('div');
                cell.className = 'pixel-cell';
                cell.dataset.row = r;
                cell.dataset.col = c;
                cell.addEventListener('click', () => selectPixel(r, c));
                mainGrid.appendChild(cell);

                const cellR = document.createElement('div');
                cellR.className = 'channel-cell';
                cellR.id = `r-${r}-${c}`;
                gridR.appendChild(cellR);

                const cellG = document.createElement('div');
                cellG.className = 'channel-cell';
                cellG.id = `g-${r}-${c}`;
                gridG.appendChild(cellG);

                const cellB = document.createElement('div');
                cellB.className = 'channel-cell';
                cellB.id = `b-${r}-${c}`;
                gridB.appendChild(cellB);
            }
        }
    }

    function selectPixel(r, c) {
        selectedRow = r;
        selectedCol = c;

        document.querySelectorAll('.pixel-cell').forEach(cell => cell.classList.remove('selected'));
        const target = document.querySelector(`.pixel-cell[data-row="${r}"][data-col="${c}"]`);
        if (target) target.classList.add('selected');

        document.getElementById('pos-display').innerText = `선택: ${r + 1}행, ${c + 1}열`;

        const [rgbR, rgbG, rgbB] = pixelData[r][c];

        document.getElementById('slider-r').value = rgbR;
        document.getElementById('num-r').value = rgbR;

        document.getElementById('slider-g').value = rgbG;
        document.getElementById('num-g').value = rgbG;

        document.getElementById('slider-b').value = rgbB;
        document.getElementById('num-b').value = rgbB;
    }

    function syncColorInput(channel, value) {
        let val = Math.max(0, Math.min(255, parseInt(value) || 0));
        document.getElementById(`num-${channel}`).value = val;
        applyColorUpdate();
    }

    function syncColorSlider(channel, value) {
        let val = Math.max(0, Math.min(255, parseInt(value) || 0));
        document.getElementById(`slider-${channel}`).value = val;
        applyColorUpdate();
    }

    function applyColorUpdate() {
        const rVal = parseInt(document.getElementById('slider-r').value);
        const gVal = parseInt(document.getElementById('slider-g').value);
        const bVal = parseInt(document.getElementById('slider-b').value);

        pixelData[selectedRow][selectedCol] = [rVal, gVal, bVal];
        originalPixelData[selectedRow][selectedCol] = [rVal, gVal, bVal];

        renderAll();
    }

    function getContrastColor(r, g, b) {
        const lum = (r * 299 + g * 587 + b * 114) / 1000;
        return lum > 120 ? '#000000' : '#FFFFFF';
    }

    function renderAll() {
        const cells = document.querySelectorAll('.pixel-cell');
        cells.forEach(cell => {
            const r = parseInt(cell.dataset.row);
            const c = parseInt(cell.dataset.col);
            const [red, green, blue] = pixelData[r][c];

            cell.style.backgroundColor = `rgb(${red}, ${green}, ${blue})`;

            const cellR = document.getElementById(`r-${r}-${c}`);
            cellR.style.backgroundColor = `rgb(${red}, 0, 0)`;
            cellR.style.color = getContrastColor(red, 0, 0);
            cellR.innerText = red;

            const cellG = document.getElementById(`g-${r}-${c}`);
            cellG.style.backgroundColor = `rgb(0, ${green}, 0)`;
            cellG.style.color = getContrastColor(0, green, 0);
            cellG.innerText = green;

            const cellB = document.getElementById(`b-${r}-${c}`);
            cellB.style.backgroundColor = `rgb(0, 0, ${blue})`;
            cellB.style.color = getContrastColor(0, 0, blue);
            cellB.innerText = blue;
        });
    }

    function applyGrayscale() {
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                const [red, green, blue] = pixelData[r][c];
                const avg = Math.round((red + green + blue) / 3);
                pixelData[r][c] = [avg, avg, avg];
            }
        }
        selectPixel(selectedRow, selectedCol);
        renderAll();
    }

    function applyBrightness() {
        const input = document.getElementById('brightness-val');

        // -255 ~ 255 정수로 정리 (빈 칸이나 잘못된 입력은 0으로)
        let delta = parseInt(input.value, 10);
        if (!Number.isFinite(delta)) delta = 0;
        delta = Math.max(-255, Math.min(255, Math.trunc(delta)));
        input.value = delta;

        if (delta === 0) return;   // 더할 값이 없으면 그대로

        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                const [red, green, blue] = pixelData[r][c];
                pixelData[r][c] = [
                    Math.max(0, Math.min(255, red + delta)),
                    Math.max(0, Math.min(255, green + delta)),
                    Math.max(0, Math.min(255, blue + delta))
                ];
            }
        }
        selectPixel(selectedRow, selectedCol);
        renderAll();
    }

    function restoreOriginal() {
        pixelData = JSON.parse(JSON.stringify(originalPixelData));
        selectPixel(selectedRow, selectedCol);
        renderAll();
    }

    async function downloadImage() {
        const exportCanvas = document.createElement('canvas');
        const ctx = exportCanvas.getContext('2d');

        const scale = 30; 
        const padding = 25;
        const channelWidth = GRID_SIZE * scale;
        
        exportCanvas.width = (channelWidth * 4) + (padding * 5);
        exportCanvas.height = channelWidth + (padding * 2) + 30;

        ctx.fillStyle = '#FBF9F4';
        ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

        const titles = ['Canvas', 'Red Channel', 'Green Channel', 'Blue Channel'];

        function drawGridAt(startX, startY, getRgbFn, getValueFn, title) {
            ctx.fillStyle = '#1B4332';
            ctx.font = 'bold 15px sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText(title, startX, startY - 10);

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const [red, green, blue] = getRgbFn(r, c);
                    ctx.fillStyle = `rgb(${red}, ${green}, ${blue})`;
                    ctx.fillRect(startX + c * scale, startY + r * scale, scale, scale);
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
                    ctx.strokeRect(startX + c * scale, startY + r * scale, scale, scale);

                    if (getValueFn) {
                        const val = getValueFn(r, c);
                        ctx.fillStyle = getContrastColor(red, green, blue);
                        ctx.font = 'bold 11px Consolas, monospace';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(val, startX + c * scale + scale / 2, startY + r * scale + scale / 2);
                    }
                }
            }
        }

        const topY = padding + 25;

        drawGridAt(padding, topY, (r, c) => pixelData[r][c], null, titles[0]);
        drawGridAt(padding * 2 + channelWidth, topY, (r, c) => [pixelData[r][c][0], 0, 0], (r, c) => pixelData[r][c][0], titles[1]);
        drawGridAt(padding * 3 + channelWidth * 2, topY, (r, c) => [0, pixelData[r][c][1], 0], (r, c) => pixelData[r][c][1], titles[2]);
        drawGridAt(padding * 4 + channelWidth * 3, topY, (r, c) => [0, 0, pixelData[r][c][2]], (r, c) => pixelData[r][c][2], titles[3]);

        exportCanvas.toBlob(async (blob) => {
            if (!blob) return;

            if ('showSaveFilePicker' in window) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: 'pixel_art_rgb_matrix.png',
                        types: [{
                            description: 'PNG Image',
                            accept: { 'image/png': ['.png'] },
                        }],
                    });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return;
                }
            }

            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = 'pixel_art_rgb_matrix.png';
            link.href = url;
            link.click();
            URL.revokeObjectURL(url);
        });
    }

    /* 배경 신경망 인터랙티브 효과 */
    const bgCanvas = document.getElementById('neural-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    let particles = [];
    const mouse = { x: null, y: null, radius: 150 };

    function resizeBgCanvas() {
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
        initParticles();
    }

    class Particle {
        constructor() {
            this.x = Math.random() * bgCanvas.width;
            this.y = Math.random() * bgCanvas.height;
            this.vx = (Math.random() - 0.5) * 0.35;
            this.vy = (Math.random() - 0.5) * 0.35;
            this.radius = Math.random() * 2 + 1.5; 
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            if (this.x < 0 || this.x > bgCanvas.width) this.vx *= -1;
            if (this.y < 0 || this.y > bgCanvas.height) this.vy *= -1;
            let dx = mouse.x - this.x; let dy = mouse.y - this.y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < mouse.radius) {
                const force = (mouse.radius - distance) / mouse.radius;
                this.x -= dx * force * 0.03; this.y -= dy * force * 0.03;
            }
        }
        draw() {
            bgCtx.beginPath(); bgCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            bgCtx.fillStyle = 'rgba(27, 67, 50, 0.15)'; bgCtx.fill();
        }
    }

    function initParticles() {
        particles = [];
        const particleCount = Math.floor((bgCanvas.width * bgCanvas.height) / 9000);
        for (let i = 0; i < particleCount; i++) particles.push(new Particle());
    }

    function animateBg() {
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        for (let i = 0; i < particles.length; i++) {
            particles[i].update(); particles[i].draw();
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x; 
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 110) {
                    bgCtx.beginPath(); bgCtx.moveTo(particles[i].x, particles[i].y); bgCtx.lineTo(particles[j].x, particles[j].y);
                    bgCtx.strokeStyle = `rgba(27, 67, 50, ${0.08 * (1 - dist / 110)})`; bgCtx.lineWidth = 1.0; bgCtx.stroke();
                }
            }
        }
        requestAnimationFrame(animateBg);
    }

    window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
    window.addEventListener('resize', resizeBgCanvas);
    window.addEventListener('DOMContentLoaded', () => { resizeBgCanvas(); animateBg(); });
</script>
